openapi: 3.1.0
info:
  title: VCdocs API
  version: 2.4.0-gd2
  description: |
    Bản máy đọc của "Hợp đồng API VCdocs v1" (Claude Docs,
    https://claude.ai/artifact/V2S8WQZXaLeGBLEBJvQvfT), phạm vi giai đoạn 1:
    M01–M09, M14, Drive cơ bản VCworkspace và /jobs.

    File này VIẾT TAY và là gốc cho cả FE (apps/web) lẫn BE (apps/api).
    Không sinh từ mã. Phiên FE/BE không được sửa file này; thấy cần sửa thì
    ghi vào contract/DE_NGHI_SUA.md và báo chủ dự án.

    Chỗ hợp đồng chưa ghi rõ, file này tự chọn và đánh dấu `x-gia-dinh`
    (giả định) để chủ dự án rà lại.

    Quy ước chung (hợp đồng mục 1):
    - JSON UTF-8; thời điểm ISO 8601 kèm múi giờ; ngày YYYY-MM-DD; tháng YYYY-MM.
    - id VCdocs là MongoDB ObjectId 24 ký tự; id Google giữ nguyên chuỗi Google.
    - Phiên đăng nhập bằng cookie HttpOnly, Secure, SameSite=Lax, 8 giờ, tự gia hạn
      khi đang dùng.
    - Mọi POST/PATCH/DELETE kèm header X-CSRF-Token (lấy từ GET /me).
    - POST tạo, ban hành, chốt, chia sẻ kèm Idempotency-Key; lặp key trong 24 giờ
      trả lại đúng kết quả cũ.
    - Mọi yêu cầu kèm X-Request-Id (FE sinh, BE trả lại). POST/PATCH/DELETE trả
      X-Audit-Id.
    - companyId suy từ tài khoản đăng nhập, không bao giờ nhận từ FE.
    - Thiếu quyền → 403; đối tượng ở drive Mật mà người gọi không được xem → 404.
    - Việc chạy lâu trả 202 + { jobId }; theo dõi GET /jobs/{id}.
    - Mỗi đối tượng có allowedActions: FE chỉ hiện nút có trong danh sách này.

    Bảo mật và giới hạn (hợp đồng mục 7):
    - Chỉ nhận yêu cầu từ tên miền giao diện (CORS); webhook Google là ngoại lệ.
    - Giới hạn tần suất 600 yêu cầu/phút/người, tìm kiếm 60/phút; vượt → 429
      kèm header Retry-After. Mọi điểm cuối có thể trả 429.
    - Thân JSON ≤ 1 MB; tải file ≤ 100 MB; danh sách ≤ 200 dòng mỗi trang.
    - Trường lạ trong thân yêu cầu bị máy chủ loại bỏ, KHÔNG báo lỗi (vì vậy các
      schema đầu vào không đặt additionalProperties: false).
    - Quyền ba tầng: vai trò hệ thống R1–R9, phạm vi phòng/khối, vai trò drive.
    - R9 không có điểm cuối đọc nội dung drive Mật; không tự sửa vai trò của mình.
servers:
  - url: https://vcdocs.vcprosperous.com/api/v1
  - url: http://localhost:4000/api/v1
    description: Máy chủ BE chạy local
  - url: http://localhost:4010
    description: Máy chủ giả (Prism) sinh từ file này

security:
  - session: []

tags:
  - name: M01 Đăng nhập, người dùng
  - name: M02 Danh mục nền, Bảng mã
  - name: M03 Cây thư mục
  - name: Drive cơ bản VCworkspace
  - name: M04 Tài liệu hệ thống
  - name: M05 Phê duyệt
  - name: M06 Danh mục hồ sơ
  - name: M07 Hồ sơ
  - name: M08 Tra cứu
  - name: M09 Chia sẻ ngoài
  - name: M14 Thông báo
  - name: Việc nền
  - name: Flow VCworkspace
    description: Chat14 — nhận event Nextcloud webhook_listeners, journal/idempotency, worker nền, readback trước khi tác động

paths:
  # ───────────────────────── M01 ─────────────────────────
  /auth/google:
    get:
      tags: [M01 Đăng nhập, người dùng]
      summary: Bắt đầu đăng nhập Google
      security: []
      parameters:
        - name: returnTo
          in: query
          description: Đường dẫn tương đối trong giao diện để quay về sau khi đăng nhập
          schema: { type: string }
          x-gia-dinh: Hợp đồng không ghi; thêm để quay lại đúng trang
      responses:
        '302':
          description: Chuyển hướng sang Google (hd=vcprosperous.com)
          headers:
            Location: { schema: { type: string } }
  /auth/google/callback:
    get:
      tags: [M01 Đăng nhập, người dùng]
      summary: Google trả về, tạo phiên
      security: []
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
      responses:
        '302':
          headers:
            Set-Cookie: { schema: { type: string } }
            Location: { schema: { type: string } }
          description: |
            Thành công: đặt cookie phiên, về trang đầu (hoặc returnTo).
            Lỗi (D13): không trả JSON mà chuyển về /dang-nhap?loi=domain · locked · expired · state · setup (D22: đúng tên miền nhưng CSDL chưa có công ty – hệ thống chưa khởi tạo).
  /auth/oidc:
    get:
      tags: [M01 Đăng nhập, người dùng]
      summary: Bắt đầu đăng nhập OIDC bằng authorization-code và PKCE S256
      security: []
      parameters:
        - name: returnTo
          in: query
          description: Đường dẫn tương đối trong giao diện để quay về sau đăng nhập
          schema: { type: string }
      responses:
        '302':
          description: Chuyển sang authorization endpoint của provider đã cấu hình phía server
          headers: { Location: { schema: { type: string } } }
  /auth/oidc/callback:
    get:
      tags: [M01 Đăng nhập, người dùng]
      summary: OIDC callback, bind issuer+sub bất biến và tạo phiên VCworkspace
      security: []
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
      responses:
        '302':
          description: Đặt cookie phiên hoặc về /dang-nhap?loi=state|expired|provider|identity|locked|setup
          headers:
            Set-Cookie: { schema: { type: string } }
            Location: { schema: { type: string } }
  /identity/lifecycle-operations:
    post:
      tags: [M01 Đăng nhập, người dùng]
      summary: R9 reconcile projection identity qua ứng dụng, Authentik và Nextcloud
      description: Journal MongoDB bền vững, Idempotency-Key bind toàn projection; từng bước phải readback. Lỗi một upstream trả 503 và giữ trạng thái partial để retry cùng operation.
      parameters: [{ $ref: '#/components/parameters/Csrf' }, { $ref: '#/components/parameters/Idempotency' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/IdentityLifecycleInput' } } } }
      responses:
        '201': { description: Projection đã reconcile đủ ba hệ thống, content: { application/json: { schema: { $ref: '#/components/schemas/IdentityLifecycleOperation' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/StorageUnavailable' }
  /identity/lifecycle-operations/{id}:
    get:
      tags: [M01 Đăng nhập, người dùng]
      summary: Đọc journal và readback state của lifecycle operation
      parameters: [{ name: id, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }]
      responses:
        '200': { description: Trạng thái operation, content: { application/json: { schema: { $ref: '#/components/schemas/IdentityLifecycleOperation' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /identity/lifecycle-operations/{id}/reconcile:
    post:
      tags: [M01 Đăng nhập, người dùng]
      summary: Retry/reconcile operation partial bằng CAS lease và readback
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
        - { $ref: '#/components/parameters/Csrf' }
      responses:
        '200': { description: Operation sau reconcile, content: { application/json: { schema: { $ref: '#/components/schemas/IdentityLifecycleOperation' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/StorageUnavailable' }
  /auth/logout:
    post:
      tags: [M01 Đăng nhập, người dùng]
      summary: Đăng xuất
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      responses:
        '204': { description: 'Đã xoá phiên' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me:
    get:
      tags: [M01 Đăng nhập, người dùng]
      summary: Tôi là ai – vai trò hệ thống, phòng, vai trò trên từng drive, csrfToken
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /users:
    get:
      tags: [M01 Đăng nhập, người dùng]
      summary: Danh sách nhân sự (R3, R9; R4 phòng mình)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Sort'
        - { name: departmentId, in: query, schema: { $ref: '#/components/schemas/Id' } }
        - { name: role, in: query, schema: { $ref: '#/components/schemas/SystemRole' } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/UserStatus' } }
        - $ref: '#/components/parameters/Q'
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/UserPage' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /users/lookup:
    get:
      tags: [M01 Đăng nhập, người dùng]
      summary: Tra người để chọn – mọi người đã đăng nhập; chỉ người đang làm việc; tối đa 20 (D3)
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1 } }
        - { name: departmentId, in: query, schema: { $ref: '#/components/schemas/Id' } }
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/UserRef' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /users/{id}:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      tags: [M01 Đăng nhập, người dùng]
      summary: Chi tiết nhân sự
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [M01 Đăng nhập, người dùng]
      summary: 'Đổi vai trò hệ thống (R9, không tự sửa vai trò mình); ghi ngày nghỉ việc (R3) → status = leaving và thông báo handover_needed cho R3 (giai đoạn 1, D4)'
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                systemRoles: { type: array, items: { $ref: '#/components/schemas/SystemRole' } }
                lastWorkingDay: { $ref: '#/components/schemas/Date' }
      responses:
        '200': { $ref: '#/components/responses/UserOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/RuleViolation' }
  /sync/google:
    post:
      tags: [M01 Đăng nhập, người dùng]
      summary: Đồng bộ nhân sự, nhóm, thành viên drive (R9; việc nền hằng đêm)
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      responses:
        '202': { $ref: '#/components/responses/JobAccepted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /drives:
    get:
      tags: [M01 Đăng nhập, người dùng]
      summary: 11 drive và vai trò của tôi trên từng drive
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Drive' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /drives/{id}/members:
    parameters:
      - { name: id, in: path, required: true, description: 'driveId của Google', schema: { type: string } }
    get:
      tags: [M01 Đăng nhập, người dùng]
      summary: Thành viên drive (R3, R9; R4 drive mình)
      parameters:
        - { name: anomalies, in: query, description: 'true = chỉ thành viên lẻ, ngoài tên miền', schema: { type: boolean } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/DriveMember' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────── M02 ─────────────────────────
  /blocks:
    get:
      tags: [M02 Danh mục nền, Bảng mã]
      summary: Danh sách khối
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { type: object, required: [items, people], properties: { items: { type: array, items: { $ref: '#/components/schemas/Block' } }, people: { $ref: '#/components/schemas/People' } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [M02 Danh mục nền, Bảng mã]
      summary: Thêm khối (R9, R3)
      parameters: [{ $ref: '#/components/parameters/Csrf' }, { $ref: '#/components/parameters/Idempotency' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BlockInput' } } } }
      responses:
        '201': { description: 'Đã tạo', content: { application/json: { schema: { $ref: '#/components/schemas/Block' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /blocks/{id}:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    patch:
      tags: [M02 Danh mục nền, Bảng mã]
      summary: Sửa khối (R9, R3)
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BlockInput' } } } }
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/Block' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /departments:
    get:
      tags: [M02 Danh mục nền, Bảng mã]
      summary: Danh sách phòng – drive
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { type: object, required: [items, people], properties: { items: { type: array, items: { $ref: '#/components/schemas/Department' } }, people: { $ref: '#/components/schemas/People' } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [M02 Danh mục nền, Bảng mã]
      summary: Thêm phòng (R9, R3)
      parameters: [{ $ref: '#/components/parameters/Csrf' }, { $ref: '#/components/parameters/Idempotency' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DepartmentInput' } } } }
      responses:
        '201': { description: 'Đã tạo', content: { application/json: { schema: { $ref: '#/components/schemas/Department' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /departments/{id}:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    patch:
      tags: [M02 Danh mục nền, Bảng mã]
      summary: Sửa phòng (R9, R3)
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DepartmentInput' } } } }
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/Department' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /divisions:
    get:
      tags: [M02 Danh mục nền, Bảng mã]
      summary: Danh sách division
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { type: object, required: [items, people], properties: { items: { type: array, items: { $ref: '#/components/schemas/Division' } }, people: { $ref: '#/components/schemas/People' } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [M02 Danh mục nền, Bảng mã]
      summary: Thêm division (R9, R3)
      parameters: [{ $ref: '#/components/parameters/Csrf' }, { $ref: '#/components/parameters/Idempotency' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DivisionInput' } } } }
      responses:
        '201': { description: 'Đã tạo', content: { application/json: { schema: { $ref: '#/components/schemas/Division' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /divisions/{id}:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    patch:
      tags: [M02 Danh mục nền, Bảng mã]
      summary: Sửa division (R9, R3)
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DivisionInput' } } } }
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/Division' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /codes:
    get:
      tags: [M02 Danh mục nền, Bảng mã]
      summary: Bảng mã
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Sort'
        - { name: type, in: query, schema: { $ref: '#/components/schemas/CodeType' } }
        - { name: departmentId, in: query, schema: { $ref: '#/components/schemas/Id' } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/CodeStatus' } }
        - $ref: '#/components/parameters/Q'
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/CodePage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [M02 Danh mục nền, Bảng mã]
      summary: Đề nghị mã mới (R4) – trạng thái pending, chưa dùng được (BR-12)
      parameters: [{ $ref: '#/components/parameters/Csrf' }, { $ref: '#/components/parameters/Idempotency' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, type, meaning, scope, reason]
              properties:
                code: { type: string, example: SEO-PTDA }
                type: { $ref: '#/components/schemas/CodeType' }
                meaning: { type: string }
                scope: { type: string, description: 'Phạm vi dùng mã (phòng, mảng)' }
                reason: { type: string }
      responses:
        '201': { description: 'Đã tạo phiếu đề nghị', content: { application/json: { schema: { $ref: '#/components/schemas/CodeDetail' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /codes/{id}/decide:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    post:
      tags: [M02 Danh mục nền, Bảng mã]
      summary: Ban Điều hành duyệt mã (R1)
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DecideInput' } } } }
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/CodeDetail' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /codes/export:
    post:
      tags: [M02 Danh mục nền, Bảng mã]
      summary: Xuất Bảng mã ra Google Sheets (R3) – job.result.fileId
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      responses:
        '202': { $ref: '#/components/responses/JobAccepted' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ───────────────────────── Drive cơ bản VCworkspace ─────────────────────────
  /spaces:
    get:
      tags: [Drive cơ bản VCworkspace]
      summary: Các không gian Drive người gọi được sử dụng
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/WorkspaceSpaceList' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /drive/items:
    get:
      tags: [Drive cơ bản VCworkspace]
      summary: Danh sách thư mục và tệp trong một không gian
      parameters:
        - { name: spaceId, in: query, required: true, schema: { $ref: '#/components/schemas/Id' } }
        - { name: parentId, in: query, schema: { $ref: '#/components/schemas/Id' } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK; người không là thành viên không nhận item của không gian
          content: { application/json: { schema: { $ref: '#/components/schemas/WorkspaceDriveItemList' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /drive/folders:
    post:
      tags: [Drive cơ bản VCworkspace]
      summary: Tạo thư mục làm việc; không ghi đè hoặc tự đổi tên
      parameters:
        - $ref: '#/components/parameters/Csrf'
        - $ref: '#/components/parameters/Idempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkspaceDriveFolderInput' }
      responses:
        '201':
          description: Đã tạo
          headers: { X-Audit-Id: { $ref: '#/components/headers/AuditId' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/WorkspaceDriveFolder' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/StorageConflict' }
        '429': { $ref: '#/components/responses/TooMany' }
        '503': { $ref: '#/components/responses/StorageUnavailable' }
        '504': { $ref: '#/components/responses/StorageTimeout' }

  /drive/files:
    post:
      tags: [Drive cơ bản VCworkspace]
      summary: Tải một tệp vào không gian; đồng bộ, không ghi đè hoặc tự đổi tên
      parameters:
        - $ref: '#/components/parameters/Csrf'
        - $ref: '#/components/parameters/Idempotency'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [spaceId, file]
              properties:
                spaceId: { $ref: '#/components/schemas/Id' }
                parentId: { $ref: '#/components/schemas/Id' }
                file: { type: string, format: binary }
      responses:
        '201':
          description: Đã tải lên và xác minh checksum
          headers: { X-Audit-Id: { $ref: '#/components/headers/AuditId' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/WorkspaceDriveFile' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/StorageConflict' }
        '413': { $ref: '#/components/responses/WorkspacePayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/StorageIntegrityMismatch' }
        '429': { $ref: '#/components/responses/TooMany' }
        '503': { $ref: '#/components/responses/StorageUnavailable' }
        '504': { $ref: '#/components/responses/StorageTimeout' }

  /drive/files/{fileId}:
    parameters:
      - { name: fileId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    get:
      tags: [Drive cơ bản VCworkspace]
      summary: Metadata một tệp mà người gọi được đọc
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/WorkspaceDriveFile' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/StorageUnavailable' }
        '504': { $ref: '#/components/responses/StorageTimeout' }

  /drive/documents:
    post:
      tags: [Soạn thảo văn bản VCworkspace]
      summary: Tạo DOCX từ mẫu và lưu thành phiên bản Drive đầu tiên
      parameters: [{ $ref: '#/components/parameters/Csrf' }, { $ref: '#/components/parameters/Idempotency' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WorkspaceDocumentInput' } } } }
      responses:
        '201': { description: Đã tạo và xác minh checksum, content: { application/json: { schema: { $ref: '#/components/schemas/WorkspaceDriveFile' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/StorageConflict' }

  /drive/spreadsheets:
    post:
      tags: [Bảng tính VCworkspace]
      summary: Tạo XLSX nghiệp vụ từ mẫu và lưu thành phiên bản Drive đầu tiên
      parameters: [{ $ref: '#/components/parameters/Csrf' }, { $ref: '#/components/parameters/Idempotency' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WorkspaceSpreadsheetInput' } } } }
      responses:
        '201': { description: Đã tạo XLSX và xác minh checksum, content: { application/json: { schema: { $ref: '#/components/schemas/WorkspaceDriveFile' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/StorageConflict' }

  /drive/presentations:
    post:
      tags: [Trình chiếu VCworkspace]
      summary: Tạo PPTX ba slide từ mẫu và lưu thành phiên bản Drive đầu tiên
      parameters: [{ $ref: '#/components/parameters/Csrf' }, { $ref: '#/components/parameters/Idempotency' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WorkspacePresentationInput' } } } }
      responses:
        '201': { description: Đã tạo PPTX và xác minh checksum, content: { application/json: { schema: { $ref: '#/components/schemas/WorkspaceDriveFile' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/StorageConflict' }

  /drive/files/{fileId}/content:
    parameters:
      - { name: fileId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    get:
      tags: [Drive cơ bản VCworkspace]
      summary: Tải nội dung một tệp mà người gọi được đọc
      responses:
        '200':
          description: Nội dung tệp; Content-Disposition dùng tên đã làm sạch
          headers:
            Content-Disposition: { schema: { type: string } }
            X-Content-SHA256: { schema: { type: string, pattern: '^[a-f0-9]{64}$' } }
          content:
            text/plain: { schema: { type: string } }
            application/octet-stream: { schema: { type: string, format: binary } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/StorageIntegrityMismatch' }
        '503': { $ref: '#/components/responses/StorageUnavailable' }
        '504': { $ref: '#/components/responses/StorageTimeout' }

  /drive/files/{fileId}/editor-config:
    parameters: [{ name: fileId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }]
    get:
      tags: [Soạn thảo văn bản VCworkspace, Bảng tính VCworkspace, Trình chiếu VCworkspace]
      summary: Cấu hình ONLYOFFICE cho DOCX/XLSX/PPTX có JWT; manager sửa, reader chỉ xem
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/WorkspaceEditorConfig' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /drive/files/{fileId}/export:
    parameters:
      - { name: fileId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
      - { name: format, in: query, required: true, schema: { type: string, enum: [docx, xlsx, pptx, pdf] } }
    get:
      tags: [Soạn thảo văn bản VCworkspace, Bảng tính VCworkspace, Trình chiếu VCworkspace]
      summary: Xuất bản hiện hành thành DOCX/XLSX/PPTX gốc hoặc PDF qua editor
      responses:
        '200':
          description: Tệp xuất
          content:
            application/vnd.openxmlformats-officedocument.wordprocessingml.document: { schema: { type: string, format: binary } }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: { schema: { type: string, format: binary } }
            application/vnd.openxmlformats-officedocument.presentationml.presentation: { schema: { type: string, format: binary } }
            application/pdf: { schema: { type: string, format: binary } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/StorageUnavailable' }

  /drive/editor/content:
    get:
      tags: [Soạn thảo văn bản VCworkspace, Bảng tính VCworkspace, Trình chiếu VCworkspace]
      summary: Máy editor tải bản hiện hành bằng vé ký và hết hạn
      security: []
      parameters: [{ name: ticket, in: query, required: true, schema: { type: string } }]
      responses:
        '200':
          description: Nội dung DOCX, XLSX hoặc PPTX
          content:
            application/vnd.openxmlformats-officedocument.wordprocessingml.document: { schema: { type: string, format: binary } }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: { schema: { type: string, format: binary } }
            application/vnd.openxmlformats-officedocument.presentationml.presentation: { schema: { type: string, format: binary } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /drive/editor/callback:
    post:
      tags: [Soạn thảo văn bản VCworkspace, Bảng tính VCworkspace, Trình chiếu VCworkspace]
      summary: ONLYOFFICE callback; error 0 chỉ sau khi phiên bản Drive đã lưu
      security: []
      parameters: [{ name: ticket, in: query, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WorkspaceEditorCallback' } } } }
      responses:
        '200': { description: Kết quả callback, content: { application/json: { schema: { type: object, required: [error], properties: { error: { type: integer, enum: [0, 1] } } } } } }

  /drive/items/{itemId}:
    parameters: [{ name: itemId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }]
    patch:
      tags: [Drive an toàn dữ liệu VCworkspace]
      summary: Đổi tên hoặc di chuyển mục, giữ nguyên itemId
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WorkspaceDriveItemUpdate' } } } }
      responses:
        '200': { description: Đã đổi tên hoặc di chuyển, content: { application/json: { schema: { $ref: '#/components/schemas/WorkspaceDriveItem' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/StorageConflict' }
        '503': { $ref: '#/components/responses/StorageUnavailable' }
        '504': { $ref: '#/components/responses/StorageTimeout' }

  /drive/files/{fileId}/versions:
    parameters: [{ name: fileId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }]
    get:
      tags: [Drive an toàn dữ liệu VCworkspace]
      summary: Liệt kê các phiên bản bất biến của tệp
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/WorkspaceDriveVersionList' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Drive an toàn dữ liệu VCworkspace]
      summary: Tạo phiên bản nội dung mới và giữ bản cũ
      parameters: [{ $ref: '#/components/parameters/Csrf' }, { $ref: '#/components/parameters/Idempotency' }]
      requestBody:
        required: true
        content: { multipart/form-data: { schema: { type: object, required: [file], properties: { file: { type: string, format: binary } } } } }
      responses:
        '201': { description: Đã tạo bản mới và xác minh checksum, content: { application/json: { schema: { $ref: '#/components/schemas/WorkspaceDriveFile' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { $ref: '#/components/responses/WorkspacePayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/StorageIntegrityMismatch' }

  /drive/files/{fileId}/versions/{versionId}/restore:
    parameters:
      - { name: fileId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
      - { name: versionId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    post:
      tags: [Drive an toàn dữ liệu VCworkspace]
      summary: Khôi phục đúng byte/checksum của một phiên bản
      parameters: [{ $ref: '#/components/parameters/Csrf' }, { $ref: '#/components/parameters/Idempotency' }]
      responses:
        '200': { description: Đã khôi phục, content: { application/json: { schema: { $ref: '#/components/schemas/WorkspaceDriveFile' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/StorageIntegrityMismatch' }

  /drive/items/{itemId}/trash:
    parameters: [{ name: itemId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }]
    post:
      tags: [Drive an toàn dữ liệu VCworkspace]
      summary: Đưa mục vào thùng rác logic, không xoá vĩnh viễn blob
      parameters: [{ $ref: '#/components/parameters/Csrf' }, { $ref: '#/components/parameters/Idempotency' }]
      responses:
        '200': { description: Đã vào thùng rác, content: { application/json: { schema: { $ref: '#/components/schemas/WorkspaceTrashResult' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /drive/trash:
    get:
      tags: [Drive an toàn dữ liệu VCworkspace]
      summary: Liệt kê thùng rác của một không gian
      parameters: [{ name: spaceId, in: query, required: true, schema: { $ref: '#/components/schemas/Id' } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/WorkspaceDriveItemList' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /drive/items/{itemId}/restore:
    parameters: [{ name: itemId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }]
    post:
      tags: [Drive an toàn dữ liệu VCworkspace]
      summary: Khôi phục mục về thư mục cha cũ và giữ nguyên itemId
      parameters: [{ $ref: '#/components/parameters/Csrf' }, { $ref: '#/components/parameters/Idempotency' }]
      responses:
        '200': { description: Đã khôi phục, content: { application/json: { schema: { $ref: '#/components/schemas/WorkspaceDriveItem' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ───────────────────────── M03 ─────────────────────────
  /folders:
    get:
      tags: [M03 Cây thư mục]
      summary: 'Cây thư mục từ sổ VCdocs (theo quyền drive). Không có parentId = thư mục cấp 1 của drive; depth tính từ đó (D8)'
      parameters:
        - { name: driveId, in: query, schema: { type: string } }
        - { name: parentId, in: query, schema: { $ref: '#/components/schemas/Id' } }
        - { name: kind, in: query, schema: { $ref: '#/components/schemas/FolderKind' } }
        - { name: depth, in: query, schema: { type: integer, minimum: 1, maximum: 10, default: 1 } }
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Folder' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [M03 Cây thư mục]
      summary: Tạo thư mục đúng khung (R4; R5 mảng mình) – area/project cần code đã duyệt; tên máy chủ ghép (BR-11)
      parameters: [{ $ref: '#/components/parameters/Csrf' }, { $ref: '#/components/parameters/Idempotency' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [driveId, kind, shortName]
              properties:
                driveId: { type: string }
                parentId: { $ref: '#/components/schemas/Id', description: 'Thiếu = gốc drive (D8). Gốc drive chỉ cho docs, plan_report, operations, area, project, closed, archive; year, month, entity bắt buộc có parentId, thiếu → 422 BR-11 (D20)' }
                kind: { $ref: '#/components/schemas/FolderKind' }
                code: { type: string }
                shortName: { type: string }
                fullName: { type: string }
      responses:
        '202': { $ref: '#/components/responses/JobAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/RuleViolation' }
  /folders/next-number:
    get:
      tags: [M03 Cây thư mục]
      summary: Số kế tiếp còn trống (R4, R5)
      parameters:
        - { name: driveId, in: query, description: 'Bắt buộc khi không có parentId (gốc drive, D8)', schema: { type: string } }
        - { name: parentId, in: query, schema: { $ref: '#/components/schemas/Id' } }
        - { name: kind, in: query, required: true, schema: { $ref: '#/components/schemas/FolderKind' } }
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { type: object, required: [number], properties: { number: { type: string, example: '11' } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /folders/ensure-periods:
    post:
      tags: [M03 Cây thư mục]
      summary: Tạo thư mục năm, tháng còn thiếu (R3; việc nền hằng tháng)
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [month]
              properties:
                driveId: { type: string }
                month: { $ref: '#/components/schemas/Month' }
      responses:
        '202': { $ref: '#/components/responses/JobAccepted' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /folders/{id}:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      tags: [M03 Cây thư mục]
      summary: Một thư mục
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/Folder' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /folders/{id}/children:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      tags: [M03 Cây thư mục]
      summary: Thư mục con
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Folder' } } } } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /folders/{id}/rename:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    post:
      tags: [M03 Cây thư mục]
      summary: Đổi tên đúng mẫu, giữ số và mã (R4)
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [shortName], properties: { shortName: { type: string }, fullName: { type: string } } }
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/Folder' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/DriveError' }
  /folders/{id}/close-project:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    post:
      tags: [M03 Cây thư mục]
      summary: Kết thúc dự án → chuyển vào 98; số không cấp lại (R4)
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      responses:
        '202': { $ref: '#/components/responses/JobAccepted' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
      x-gia-dinh: Hợp đồng không ghi 202; chọn 202 job vì phải di chuyển trên Drive
  /folders/{id}/resync:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    post:
      tags: [M03 Cây thư mục]
      summary: Đọc lại từ Drive khi lệch (R3, R4)
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/Folder' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/DriveError' }

  # ───────────────────────── M04 ─────────────────────────
  /documents:
    get:
      tags: [M04 Tài liệu hệ thống]
      summary: Danh mục tài liệu – tài liệu Mật chỉ hiện mã và tên với người không có quyền
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Sort'
        - { name: type, in: query, schema: { $ref: '#/components/schemas/DocumentType' } }
        - { name: level, in: query, schema: { $ref: '#/components/schemas/DocumentLevel' } }
        - { name: departmentId, in: query, schema: { $ref: '#/components/schemas/Id' } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/DocumentStatus' } }
        - $ref: '#/components/parameters/Q'
        - { name: reviewDueBefore, in: query, schema: { $ref: '#/components/schemas/Date' } }
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/DocumentPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [M04 Tài liệu hệ thống]
      summary: Đăng ký tài liệu (R4) → registered; QD chỉ cấp VCPV (BR-02)
      parameters: [{ $ref: '#/components/parameters/Csrf' }, { $ref: '#/components/parameters/Idempotency' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, level, title, departmentId, drafterId]
              properties:
                type: { $ref: '#/components/schemas/DocumentType' }
                level: { $ref: '#/components/schemas/DocumentLevel' }
                title: { type: string, minLength: 1 }
                departmentId: { $ref: '#/components/schemas/Id' }
                drafterId: { $ref: '#/components/schemas/Id' }
                checkerId: { $ref: '#/components/schemas/Id' }
                dueDate: { $ref: '#/components/schemas/Date' }
      responses:
        '201': { $ref: '#/components/responses/DocumentOk201' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/RuleViolation' }
  /documents/similar:
    get:
      tags: [M04 Tài liệu hệ thống]
      summary: Tài liệu tên gần giống – tránh soạn trùng (R4)
      parameters:
        - { name: title, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/DocumentSummary' } } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /documents/by-code/{code}:
    parameters:
      - { name: code, in: path, required: true, schema: { type: string, example: QT-MKT-01 } }
    get:
      tags: [M08 Tra cứu]
      summary: Mở bản hiệu lực theo mã; bản cũ chỉ qua versions
      responses:
        '200': { $ref: '#/components/responses/DocumentOk' }
        '404': { $ref: '#/components/responses/NotFound' }
  /documents/catalog/export:
    post:
      tags: [M04 Tài liệu hệ thống]
      summary: Xuất Danh mục tài liệu VCPV (R3)
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      responses:
        '202': { $ref: '#/components/responses/JobAccepted' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /documents/{id}:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      tags: [M04 Tài liệu hệ thống]
      summary: Chi tiết kèm versions
      responses:
        '200': { $ref: '#/components/responses/DocumentOk' }
        '404': { $ref: '#/components/responses/NotFound' }
  /documents/{id}/assign-code:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    post:
      tags: [M04 Tài liệu hệ thống]
      summary: Cấp mã kế tiếp (R3) registered → coded; mã đã huỷ không cấp lại (BR-01)
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      responses:
        '200': { $ref: '#/components/responses/DocumentOk' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /documents/{id}/create-draft:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    post:
      tags: [M04 Tài liệu hệ thống]
      summary: Tạo file nháp từ BM khung, điền bảng nhận diện (drafterId) coded → drafting
      parameters: [{ $ref: '#/components/parameters/Csrf' }, { $ref: '#/components/parameters/Idempotency' }]
      responses:
        '202': { $ref: '#/components/responses/JobAccepted' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/RuleViolation' }
  /documents/{id}/request-feedback:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    post:
      tags: [M04 Tài liệu hệ thống]
      summary: Lấy góp ý (drafterId) drafting → feedback; cấp quyền Nhận xét cho người ngoài drive
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dueDate]
              properties:
                reviewerIds: { type: array, items: { $ref: '#/components/schemas/Id' } }
                departmentIds: { type: array, items: { $ref: '#/components/schemas/Id' } }
                dueDate: { $ref: '#/components/schemas/Date' }
      responses:
        '200': { $ref: '#/components/responses/DocumentOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { $ref: '#/components/responses/DriveError' }
  /documents/{id}/feedback:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      tags: [M04 Tài liệu hệ thống]
      summary: Số nhận xét chưa đóng (đọc từ Drive) (drafterId, R4)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, required: [openComments], properties: { openComments: { type: integer, minimum: 0 }, checkedAt: { $ref: '#/components/schemas/DateTime' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/DriveError' }
  /documents/{id}/submit:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    post:
      tags: [M04 Tài liệu hệ thống]
      summary: Trình duyệt (người soạn được giao hoặc R4 phòng soạn, D2) → submitted; tạo Approval, khoá tạm, chụp phiên bản; còn nhận xét mở → 422 trừ khi override
      parameters: [{ $ref: '#/components/parameters/Csrf' }, { $ref: '#/components/parameters/Idempotency' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                overrideOpenComments: { type: boolean }
                reason: { type: string, description: 'Bắt buộc khi overrideOpenComments = true' }
      responses:
        '200': { $ref: '#/components/responses/DocumentOk' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/RuleViolation' }
  /documents/{id}/issue:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    post:
      tags: [M04 Tài liệu hệ thống]
      summary: Ban hành (R3 cấp VCPV; R4 cấp phòng) approved → effective
      parameters: [{ $ref: '#/components/parameters/Csrf' }, { $ref: '#/components/parameters/Idempotency' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [effectiveFrom]
              properties:
                effectiveFrom: { $ref: '#/components/schemas/Date' }
                notifyGroupIds: { type: array, items: { type: string }, description: 'Email nhóm Google' }
      responses:
        '202': { $ref: '#/components/responses/JobAccepted' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/RuleViolation' }
  /documents/{id}/revise:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    post:
      tags: [M04 Tài liệu hệ thống]
      summary: Mở sửa (R4) – minor mở khoá có hạn; major → revising, bản cũ vẫn hiệu lực (BR-06, BR-07)
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, reason]
              properties:
                kind: { $ref: '#/components/schemas/RevisionKind' }
                reason: { type: string }
                unlockDays: { type: integer, minimum: 1, description: 'Chỉ dùng với minor' }
      responses:
        '200': { $ref: '#/components/responses/DocumentOk' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /documents/{id}/withdraw:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    post:
      tags: [M04 Tài liệu hệ thống]
      summary: 'Trình huỷ bỏ (R4) – tạo Approval document_withdrawal (BR-08). HD, BM cấp phòng do trưởng phòng trình thì GĐ khối phụ trách duyệt (D21, BR-05)'
      parameters: [{ $ref: '#/components/parameters/Csrf' }, { $ref: '#/components/parameters/Idempotency' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [reason], properties: { reason: { type: string }, replacedById: { $ref: '#/components/schemas/Id' } } }
      responses:
        '201': { description: 'Đã tạo phiếu', content: { application/json: { schema: { $ref: '#/components/schemas/ApprovalDetail' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /documents/{id}/review:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    post:
      tags: [M04 Tài liệu hệ thống]
      summary: Kết quả rà soát định kỳ (R4) – ghi kết quả và reviewDue mới
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [result], properties: { result: { type: string, enum: [keep, revise, withdraw] }, note: { type: string } } }
      responses:
        '200': { $ref: '#/components/responses/DocumentOk' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /documents/{id}/integrity:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      tags: [M04 Tài liệu hệ thống]
      summary: Khoá còn không, phiên bản hiện tại có khớp bản hiệu lực (R3, R4)
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/Integrity' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/DriveError' }
  /documents/{id}/relock:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    post:
      tags: [M04 Tài liệu hệ thống]
      summary: Khoá lại ngay (R3, R4, việc nền)
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      responses:
        '200': { $ref: '#/components/responses/DocumentOk' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/DriveError' }
  /external-documents:
    post:
      tags: [M04 Tài liệu hệ thống]
      summary: Nhập tài liệu bên ngoài (R6 trở lên) – sao chép vào 00 Tài liệu (BR-31)
      parameters: [{ $ref: '#/components/parameters/Csrf' }, { $ref: '#/components/parameters/Idempotency' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source, number, issuedAt, title, departmentId]
              properties:
                source: { type: string, description: 'Cơ quan ban hành' }
                number: { type: string, description: 'Số hiệu văn bản' }
                issuedAt: { $ref: '#/components/schemas/Date' }
                title: { type: string }
                departmentId: { $ref: '#/components/schemas/Id' }
                fileId: { type: string, description: 'File Google đã có (một trong fileId hoặc url)' }
                url: { type: string, format: uri }
      responses:
        '202': { $ref: '#/components/responses/JobAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /external-documents/{id}:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    patch:
      tags: [M04 Tài liệu hệ thống]
      summary: Cập nhật tình trạng tài liệu bên ngoài (R6 trở lên); isSuperseded → trả relatedIds đang dẫn chiếu
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { isSuperseded: { type: boolean }, lastCheckedAt: { $ref: '#/components/schemas/DateTime' } } }
      responses:
        '200': { $ref: '#/components/responses/DocumentOk' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }


      parameters:
        - { name: blockId, in: query, schema: { $ref: '#/components/schemas/Id' } }
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { type: object, required: [items, people], properties: { items: { type: array, items: { $ref: '#/components/schemas/Delegation' } }, people: { $ref: '#/components/schemas/People' } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [M05 Phê duyệt]
      summary: Thêm dòng uỷ quyền (R2) – vượt hạn mức hoặc việc liên khối → 422 BR-24
      parameters: [{ $ref: '#/components/parameters/Csrf' }, { $ref: '#/components/parameters/Idempotency' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DelegationInput' } } } }
      responses:
        '201': { description: 'Đã tạo', content: { application/json: { schema: { $ref: '#/components/schemas/DelegationDetail' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/RuleViolation' }
  /delegations/{id}:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    patch:
      tags: [M05 Phê duyệt]
      summary: Sửa dòng uỷ quyền (R2)
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DelegationInput' } } } }
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/DelegationDetail' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/RuleViolation' }

  # ───────────────────────── M06 ─────────────────────────
  /record-types:
    get:
      tags: [M06 Danh mục hồ sơ]
      summary: Loại hồ sơ
      parameters:
        - { name: departmentId, in: query, schema: { $ref: '#/components/schemas/Id' } }
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/RecordType' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [M06 Danh mục hồ sơ]
      summary: Khai báo loại hồ sơ (R4) – thời hạn chưa duyệt → chưa lập được hồ sơ (BR-20)
      parameters: [{ $ref: '#/components/parameters/Csrf' }, { $ref: '#/components/parameters/Idempotency' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RecordTypeInput' } } } }
      responses:
        '201': { description: 'Đã tạo', content: { application/json: { schema: { $ref: '#/components/schemas/RecordTypeDetail' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /record-types/catalog/export:
    post:
      tags: [M06 Danh mục hồ sơ]
      summary: Xuất Danh mục hồ sơ VCPV (R3)
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      responses:
        '202': { $ref: '#/components/responses/JobAccepted' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /record-types/{id}:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      tags: [M06 Danh mục hồ sơ]
      summary: Chi tiết loại hồ sơ
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/RecordTypeDetail' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [M06 Danh mục hồ sơ]
      summary: Sửa loại hồ sơ (R4) – đổi thời hạn → retentionStatus về draft, phải trình lại
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RecordTypePatch' } } } }
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/RecordTypeDetail' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /record-types/{id}/submit-retention:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    post:
      tags: [M06 Danh mục hồ sơ]
      summary: Trình thời hạn lưu (R4) – Approval retention cho R1; kế toán thêm R8, nhân sự thêm R3
      parameters: [{ $ref: '#/components/parameters/Csrf' }, { $ref: '#/components/parameters/Idempotency' }]
      responses:
        '201': { description: 'Đã tạo phiếu', content: { application/json: { schema: { $ref: '#/components/schemas/ApprovalDetail' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ───────────────────────── M07 ─────────────────────────
  /records:
    get:
      tags: [M07 Hồ sơ]
      summary: Danh sách hồ sơ (theo quyền drive)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Sort'
        - { name: recordTypeId, in: query, schema: { $ref: '#/components/schemas/Id' } }
        - { name: departmentId, in: query, schema: { $ref: '#/components/schemas/Id' } }
        - { name: workMonth, in: query, schema: { $ref: '#/components/schemas/Month' } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/RecordStatus' } }
        - { name: kind, in: query, schema: { $ref: '#/components/schemas/RecordKind' } }
        - $ref: '#/components/parameters/Q'
        - { name: identifier, in: query, schema: { type: string } }
        - { name: createdBy, in: query, schema: { $ref: '#/components/schemas/Id' } }
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/RecordPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [M07 Hồ sơ]
      summary: Lập hồ sơ từ biểu mẫu (R4, R5, R6, R8) – tạo file, đặt tên, đặt chỗ (BR-09, BR-10, BR-28)
      parameters: [{ $ref: '#/components/parameters/Csrf' }, { $ref: '#/components/parameters/Idempotency' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RecordInput' } } } }
      responses:
        '202': { $ref: '#/components/responses/JobAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/RuleViolation' }
  /records/upload:
    post:
      tags: [M07 Hồ sơ]
      summary: Tải file lên cùng trường lập hồ sơ (R4, R5, R6, R8) – chuyển định dạng Google trừ PDF, XML, scan (BR-14)
      parameters: [{ $ref: '#/components/parameters/Csrf' }, { $ref: '#/components/parameters/Idempotency' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              allOf:
                - $ref: '#/components/schemas/RecordInput'
                - type: object
                  required: [file]
                  properties:
                    file: { type: string, format: binary, description: '≤ 100 MB' }
      responses:
        '202': { $ref: '#/components/responses/JobAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/RuleViolation' }
  /records/unregistered:
    get:
      tags: [M07 Hồ sơ]
      summary: File trên Drive chưa đăng ký (R4, R5)
      parameters:
        - { name: driveId, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/DriveFile' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /records/claim:
    post:
      tags: [M07 Hồ sơ]
      summary: Đăng ký ngược file tạo thẳng trên Drive (người tạo file, R4) – tên sai thì máy chủ đổi đúng
      parameters: [{ $ref: '#/components/parameters/Csrf' }, { $ref: '#/components/parameters/Idempotency' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileId, recordTypeId, kind, functionCode, workMonth]
              properties:
                fileId: { type: string }
                recordTypeId: { $ref: '#/components/schemas/Id' }
                kind: { $ref: '#/components/schemas/RecordKind' }
                functionCode: { type: string }
                subject: { type: string, x-gia-dinh: 'Hợp đồng không ghi; cần để ghép tên đúng' }
                identifier: { type: string }
                workMonth: { $ref: '#/components/schemas/Month' }
      responses:
        '202': { $ref: '#/components/responses/JobAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/RuleViolation' }
      x-gia-dinh: Hợp đồng không ghi kiểu trả; chọn 202 job vì phải đổi tên, di chuyển trên Drive
  /records/{id}:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      tags: [M07 Hồ sơ]
      summary: Chi tiết hồ sơ
      responses:
        '200': { $ref: '#/components/responses/RecordOk' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [M07 Hồ sơ]
      summary: Sửa hồ sơ (người lập) – chỉ khi drafting, khác → 409
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                subject: { type: string }
                identifier: { type: string }
                workMonth: { $ref: '#/components/schemas/Month' }
                paperLocation: { type: string }
      responses:
        '200': { $ref: '#/components/responses/RecordOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /records/{id}/submit:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    post:
      tags: [M07 Hồ sơ]
      summary: Trình duyệt hồ sơ (người lập) – khoá tạm, chụp phiên bản
      parameters: [{ $ref: '#/components/parameters/Csrf' }, { $ref: '#/components/parameters/Idempotency' }]
      responses:
        '200': { $ref: '#/components/responses/RecordOk' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/RuleViolation' }
  /records/{id}/finalize:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    post:
      tags: [M07 Hồ sơ]
      summary: Chốt (người lập, R4) – PDF + dấu chốt + QR, khoá, mã băm, kho riêng (BR-13, BR-26, BR-29)
      parameters: [{ $ref: '#/components/parameters/Csrf' }, { $ref: '#/components/parameters/Idempotency' }]
      responses:
        '202': { $ref: '#/components/responses/JobAccepted' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/RuleViolation' }
  /records/{id}/adjust:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    post:
      tags: [M07 Hồ sơ]
      summary: Tạo hồ sơ Điều chỉnh (R5, R6) – trả record mới có adjustsId
      parameters: [{ $ref: '#/components/parameters/Csrf' }, { $ref: '#/components/parameters/Idempotency' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [reason], properties: { reason: { type: string } } }
      responses:
        '201': { $ref: '#/components/responses/RecordOk201' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /records/{id}/scan:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    post:
      tags: [M07 Hồ sơ]
      summary: Gắn bản scan (người lập) – ghi vị trí giấy vào Mô tả file
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, paperLocation]
              properties:
                file: { type: string, format: binary, description: '≤ 100 MB' }
                paperLocation: { type: string }
      responses:
        '202': { $ref: '#/components/responses/JobAccepted' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
      x-gia-dinh: Hợp đồng không ghi kiểu trả; chọn 202 job vì phải tải file lên Drive
  /records/{id}/hold:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    post:
      tags: [M07 Hồ sơ]
      summary: Giữ lại, không được huỷ (R4, R1, R8) finalized → held (BR-22)
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [reasonType, reason], properties: { reasonType: { $ref: '#/components/schemas/HoldReasonType' }, reason: { type: string, description: 'Diễn giải' } } }
      responses:
        '200': { $ref: '#/components/responses/RecordOk' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/RuleViolation' }
  /records/{id}/release-hold:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    post:
      tags: [M07 Hồ sơ]
      summary: Bỏ giữ lại (R4, R1, R8) held → finalized
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      responses:
        '200': { $ref: '#/components/responses/RecordOk' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /records/{id}/integrity:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      tags: [M07 Hồ sơ]
      summary: Khoá, mã băm, phiên bản có khớp (R3, R4)
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/Integrity' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/DriveError' }
  /verify/{verifyCode}:
    parameters:
      - { name: verifyCode, in: path, required: true, schema: { type: string } }
    get:
      tags: [M07 Hồ sơ]
      summary: Tra mã trên dấu chốt (QR) – đã đăng nhập, không cần quyền drive; không trả nội dung
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [number, status, finalizedAt, pdfSha256]
                properties:
                  number: { type: string, example: HS-2026-000123 }
                  status: { $ref: '#/components/schemas/RecordStatus' }
                  finalizedAt: { $ref: '#/components/schemas/DateTime' }
                  pdfSha256: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────── M08 ─────────────────────────
  /search:
    get:
      tags: [M08 Tra cứu]
      summary: Tìm theo mã, tên, số định danh – chỉ trả thứ được xem; ≤ 2 giây
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1 } }
        - { name: scope, in: query, schema: { type: string, enum: [all, documents, records], default: all }, x-gia-dinh: 'Hợp đồng không liệt kê giá trị scope' }
        - { name: departmentId, in: query, schema: { $ref: '#/components/schemas/Id' } }
        - { name: workMonth, in: query, schema: { $ref: '#/components/schemas/Month' } }
        - { name: status, in: query, schema: { type: string } }
        - { name: createdBy, in: query, schema: { $ref: '#/components/schemas/Id' } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/SearchPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooMany' }
  /search/suggest:
    get:
      tags: [M08 Tra cứu]
      summary: Gợi ý khi gõ
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1 } }
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, maxItems: 10, items: { $ref: '#/components/schemas/SearchHit' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooMany' }
      x-gia-dinh: 'Giới hạn tìm kiếm 60/phút áp cả cho gợi ý'

  # ───────────────────────── M09 ─────────────────────────
  /external-shares:
    get:
      tags: [M09 Chia sẻ ngoài]
      summary: Sổ chia sẻ ngoài (R4 phòng mình, R3; người chia sẻ)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Sort'
        - { name: departmentId, in: query, schema: { $ref: '#/components/schemas/Id' } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ShareStatus' } }
        - { name: fileId, in: query, schema: { type: string } }
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/ExternalSharePage' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [M09 Chia sẻ ngoài]
      summary: Chia sẻ ra ngoài (R5, R6, R8) – tài khoản máy thực hiện; file Mật → pending_approval (R4); hạn có giới hạn (BR-17)
      parameters: [{ $ref: '#/components/parameters/Csrf' }, { $ref: '#/components/parameters/Idempotency' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileId, email, role, reason, expiresAt]
              properties:
                fileId: { type: string }
                email: { type: string, format: email }
                role: { $ref: '#/components/schemas/ShareRole' }
                reason: { type: string }
                expiresAt: { $ref: '#/components/schemas/DateTime' }
      responses:
        '201': { $ref: '#/components/responses/ExternalShareOk201' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/RuleViolation' }
        '502': { $ref: '#/components/responses/DriveError' }
  /external-shares/revoke-all:
    post:
      tags: [M09 Chia sẻ ngoài]
      summary: Gỡ hết chia sẻ ngoài của phòng (R4)
      parameters:
        - $ref: '#/components/parameters/Csrf'
        - { name: departmentId, in: query, required: true, schema: { $ref: '#/components/schemas/Id' } }
      responses:
        '202': { $ref: '#/components/responses/JobAccepted' }
        '403': { $ref: '#/components/responses/Forbidden' }
      x-gia-dinh: Hợp đồng không ghi kiểu trả; chọn 202 job vì có thể gỡ nhiều quyền
  /external-shares/anomalies:
    get:
      tags: [M09 Chia sẻ ngoài]
      summary: Chia sẻ trong nhật ký Google không có trong sổ (R4, R3)
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/ExternalShare' } } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /external-shares/{id}/revoke:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    post:
      tags: [M09 Chia sẻ ngoài]
      summary: Gỡ chia sẻ (người chia sẻ, R4)
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      responses:
        '200': { $ref: '#/components/responses/ExternalShareOk' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { $ref: '#/components/responses/DriveError' }
  /external-shares/{id}/extend:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    post:
      tags: [M09 Chia sẻ ngoài]
      summary: Gia hạn chia sẻ (người chia sẻ, R4)
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [expiresAt], properties: { expiresAt: { $ref: '#/components/schemas/DateTime' } } }
      responses:
        '200': { $ref: '#/components/responses/ExternalShareOk' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/RuleViolation' }

  # ───────────────────────── M14 ─────────────────────────
  /notifications:
    get:
      tags: [M14 Thông báo]
      summary: Thông báo trong ứng dụng
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - { name: unread, in: query, schema: { type: boolean } }
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/NotificationPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /notifications/{id}/read:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    post:
      tags: [M14 Thông báo]
      summary: Đánh dấu đã đọc
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      responses:
        '204': { description: 'OK' }
        '404': { $ref: '#/components/responses/NotFound' }
  /notifications/read-all:
    post:
      tags: [M14 Thông báo]
      summary: Đánh dấu tất cả đã đọc
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      responses:
        '204': { description: 'OK' }
  /notification-settings:
    get:
      tags: [M14 Thông báo]
      summary: Kênh nhận thông báo của tôi
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/NotificationSettings' } } } }
    patch:
      tags: [M14 Thông báo]
      summary: Đổi kênh nhận (zalo từ giai đoạn 3 → 422 nếu bật sớm)
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NotificationSettings' } } } }
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/NotificationSettings' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/RuleViolation' }

  # ───────────────────────── Việc nền ─────────────────────────
  /jobs:
    get:
      tags: [Việc nền]
      summary: Danh sách việc chạy lâu (mine=true chỉ của tôi; R9 xem tất cả)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - { name: mine, in: query, schema: { type: boolean, default: true } }
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/JobPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /jobs/{id}:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      tags: [Việc nền]
      summary: Theo dõi một việc chạy lâu (người yêu cầu, R9)
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/JobDetail' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: vcdocs_sid
      description: Cookie phiên HttpOnly, Secure, SameSite=Lax, 8 giờ, tự gia hạn khi đang dùng (hợp đồng mục 8, Q4)
      x-gia-dinh: Tên cookie do file này chọn

  parameters:
    IdPath: { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
    Sort: { name: sort, in: query, description: 'Ví dụ -createdAt,title (dấu trừ = giảm dần)', schema: { type: string } }
    Q: { name: q, in: query, description: 'Tìm theo chữ', schema: { type: string } }
    Csrf: { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
    Idempotency: { name: Idempotency-Key, in: header, required: true, description: 'Chuỗi ngẫu nhiên do FE sinh; giữ 24 giờ', schema: { type: string, minLength: 8, maxLength: 128 } }

  headers:
    RequestId: { description: 'Trả lại X-Request-Id của yêu cầu', schema: { type: string } }
    AuditId: { description: 'Id dòng audit_logs vừa ghi', schema: { type: string } }

  responses:
    JobAccepted:
      description: Đã nhận, chạy nền
      headers:
        X-Audit-Id: { $ref: '#/components/headers/AuditId' }
      content:
        application/json:
          schema: { type: object, required: [jobId], properties: { jobId: { $ref: '#/components/schemas/Id' } } }
    UserOk: { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
    DocumentOk: { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/DocumentDetail' } } } }
    DocumentOk201: { description: 'Đã tạo', content: { application/json: { schema: { $ref: '#/components/schemas/DocumentDetail' } } } }
    RecordOk: { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/RecordDetail' } } } }
    RecordOk201: { description: 'Đã tạo', content: { application/json: { schema: { $ref: '#/components/schemas/RecordDetail' } } } }
    ApprovalOk: { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/ApprovalDetail' } } } }
    ExternalShareOk: { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/ExternalShareDetail' } } } }
    ExternalShareOk201: { description: 'Đã tạo', content: { application/json: { schema: { $ref: '#/components/schemas/ExternalShareDetail' } } } }
    BadRequest: { description: 'Dữ liệu sai (VALIDATION)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Unauthorized: { description: 'Chưa đăng nhập', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Forbidden: { description: 'Không có quyền (FORBIDDEN)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    NotFound: { description: 'Không có, hoặc thuộc drive Mật không được xem (NOT_FOUND)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Conflict: { description: 'Trùng hoặc sai trạng thái (STATE_INVALID, DUPLICATE)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    RuleViolation: { description: 'Vi phạm quy tắc nghiệp vụ (RULE_VIOLATION, kèm rule = mã BR)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Locked: { description: 'File đang khoá (LOCKED)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    TooMany: { description: 'Quá nhiều yêu cầu (600/phút/người; tìm kiếm 60/phút)', headers: { Retry-After: { description: 'Số giây chờ trước khi gọi lại', schema: { type: integer, minimum: 1 } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    PayloadTooLarge: { description: 'Thân JSON > 1 MB hoặc file > 100 MB', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    DriveError: { description: 'Google trả lỗi (DRIVE_ERROR)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  schemas:
    # ── Kiểu cơ bản ──
    Id: { type: string, pattern: '^[a-f0-9]{24}$', example: 6712f0c2a1b2c3d4e5f60718 }
    Date: { type: string, format: date, example: '2026-10-19' }
    DateTime: { type: string, format: date-time, example: '2026-10-19T21:46:00+07:00' }
    Month: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$', example: 2026-10 }

    # ── Giá trị cố định (hợp đồng mục 2) ──
    DocumentType: { type: string, enum: [QD, QT, HD, BM, EXT] }
    DocumentLevel: { type: string, enum: [VCPV, DEPT] }
    DocumentStatus: { type: string, enum: [registered, coded, drafting, feedback, submitted, approved, effective, revising, withdrawn] }
    RevisionKind: { type: string, enum: [minor, major] }
    RecordKind: { type: string, enum: [KH, BC, DX, TD, GV, BB, TB, OPS] }
    RecordStatus: { type: string, enum: [drafting, submitted, finalized, held, disposal_proposed, disposed] }
    ApprovalObjectType: { type: string, enum: [document, document_withdrawal, record, code, retention, external_share, disposal, delegation] }
    ApprovalStatus: { type: string, enum: [pending, approved, changes_requested, cancelled, expired, invalidated] }
    SystemRole: { type: string, enum: [R1, R2, R3, R4, R5, R6, R7, R8, R9] }
    DriveRole: { type: string, enum: [organizer, fileOrganizer, writer, commenter, reader] }
    SecurityLevel: { type: string, enum: [internal, department, confidential] }
    FolderKind: { type: string, enum: [docs, plan_report, operations, area, project, closed, archive, year, month, entity] }
    FolderStatus: { type: string, enum: [active, closed, archived] }
    ShareRole: { type: string, enum: [reader, commenter] }
    ShareStatus: { type: string, enum: [pending_approval, active, expired, revoked] }
    JobStatus: { type: string, enum: [queued, running, done, failed] }
    NotificationChannel: { type: string, enum: [email, zalo, inapp] }
    UserStatus: { type: string, enum: [active, leaving, left], x-gia-dinh: 'Hợp đồng không liệt kê giá trị' }
    CodeType: { type: string, enum: [department, function, channel, project, division], x-gia-dinh: 'Hợp đồng không liệt kê loại mã' }
    CodeStatus: { type: string, enum: [pending, approved, rejected, retired], x-gia-dinh: 'Hợp đồng chỉ nói pending' }
    HoldReasonType: { type: string, enum: [dispute, inspection, warranty, receivable, contract_open, board_request], description: 'Tranh chấp · Thanh tra, kiểm toán · Bảo hành · Công nợ · Hợp đồng chưa thanh lý · Ban Điều hành yêu cầu (BR-22, D5)' }
    ErrorCode: { type: string, enum: [VALIDATION, UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, DUPLICATE, STATE_INVALID, RULE_VIOLATION, LOCKED, PAYLOAD_TOO_LARGE, RATE_LIMITED, DRIVE_ERROR, MAINTENANCE, INTERNAL] }

    # ── Khung chung ──
    Base:
      type: object
      required: [id, companyId, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        companyId: { $ref: '#/components/schemas/Id' }
        createdAt: { $ref: '#/components/schemas/DateTime' }
        createdBy: { $ref: '#/components/schemas/Id' }
        updatedAt: { $ref: '#/components/schemas/DateTime' }
        updatedBy: { $ref: '#/components/schemas/Id' }
    # allowedActions (D9): tên kebab-case = đoạn cuối đường dẫn; sửa thông tin (PATCH) = update.
    # FE chỉ hiện nút có trong danh sách; BE vẫn kiểm lại khi gọi.
    DocumentActions:
      type: object
      required: [allowedActions]
      properties:
        allowedActions: { type: array, uniqueItems: true, items: { type: string, enum: [assign-code, create-draft, request-feedback, feedback, submit, issue, revise, review, withdraw, relock, integrity, update-external] } }
    ApprovalActions:
      type: object
      required: [allowedActions]
      properties:
        allowedActions: { type: array, uniqueItems: true, items: { type: string, enum: [check, decide, cancel, remind] } }
    CodeActions:
      type: object
      required: [allowedActions]
      properties:
        allowedActions: { type: array, uniqueItems: true, items: { type: string, enum: [decide] } }
    RecordTypeActions:
      type: object
      required: [allowedActions]
      properties:
        allowedActions: { type: array, uniqueItems: true, items: { type: string, enum: [update, submit-retention] } }
    RecordActions:
      type: object
      required: [allowedActions]
      properties:
        allowedActions: { type: array, uniqueItems: true, items: { type: string, enum: [update, submit, finalize, adjust, scan, hold, release-hold, share, integrity] } }
    ExternalShareActions:
      type: object
      required: [allowedActions]
      properties:
        allowedActions: { type: array, uniqueItems: true, items: { type: string, enum: [extend, revoke] } }
    UserActions:
      type: object
      required: [allowedActions]
      properties:
        allowedActions: { type: array, uniqueItems: true, items: { type: string, enum: [update-roles, update-leave] } }
    FolderActions:
      type: object
      required: [allowedActions]
      properties:
        allowedActions: { type: array, uniqueItems: true, items: { type: string, enum: [create-child, rename, close-project, resync] } }
    CatalogActions:
      type: object
      required: [allowedActions]
      properties:
        allowedActions: { type: array, uniqueItems: true, items: { type: string, enum: [update] } }
    PageMeta:
      type: object
      required: [page, limit, total, people]
      properties:
        page: { type: integer, minimum: 1 }
        limit: { type: integer, minimum: 1, maximum: 200 }
        total: { type: integer, minimum: 0 }
        people: { $ref: '#/components/schemas/People' }
    People:
      type: object
      description: 'id người → UserRef, cho mọi id người xuất hiện trong phản hồi (D10)'
      additionalProperties: { $ref: '#/components/schemas/UserRef' }
    DocumentDetail:
      description: 'Document kèm people (chi tiết một đối tượng, D17)'
      allOf:
        - $ref: '#/components/schemas/Document'
        - $ref: '#/components/schemas/WithPeople'
    RecordDetail:
      description: 'Record kèm people (chi tiết một đối tượng, D17)'
      allOf:
        - $ref: '#/components/schemas/Record'
        - $ref: '#/components/schemas/WithPeople'
    ApprovalDetail:
      description: 'Approval kèm people (chi tiết một đối tượng, D17)'
      allOf:
        - $ref: '#/components/schemas/Approval'
        - $ref: '#/components/schemas/WithPeople'
    CodeDetail:
      description: 'Code kèm people (chi tiết một đối tượng, D17)'
      allOf:
        - $ref: '#/components/schemas/Code'
        - $ref: '#/components/schemas/WithPeople'
    RecordTypeDetail:
      description: 'RecordType kèm people (chi tiết một đối tượng, D17)'
      allOf:
        - $ref: '#/components/schemas/RecordType'
        - $ref: '#/components/schemas/WithPeople'
    ExternalShareDetail:
      description: 'ExternalShare kèm people (chi tiết một đối tượng, D17)'
      allOf:
        - $ref: '#/components/schemas/ExternalShare'
        - $ref: '#/components/schemas/WithPeople'
    DelegationDetail:
      description: 'Delegation kèm people (chi tiết một đối tượng, D17)'
      allOf:
        - $ref: '#/components/schemas/Delegation'
        - $ref: '#/components/schemas/WithPeople'
    JobDetail:
      description: 'Job kèm people (chi tiết một đối tượng, D17)'
      allOf:
        - $ref: '#/components/schemas/Job'
        - $ref: '#/components/schemas/WithPeople'
    WithPeople:
      type: object
      required: [people]
      properties:
        people: { $ref: '#/components/schemas/People' }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: { $ref: '#/components/schemas/ErrorCode' }
            message: { type: string, description: 'Tiếng Việt cho người dùng' }
            rule: { type: string, description: 'Mã BR khi code = RULE_VIOLATION', example: BR-02 }
            details:
              type: array
              items: { type: object, required: [field, issue], properties: { field: { type: string }, issue: { type: string } } }
            requestId: { type: string }
      example:
        error: { code: RULE_VIOLATION, message: Quy định chỉ được đăng ký ở cấp VCPV, rule: BR-02, details: [{ field: level, issue: must_be_VCPV }], requestId: 3f1c9a }
    Lock:
      type: object
      required: [isLocked]
      properties:
        isLocked: { type: boolean }
        lockedAt: { $ref: '#/components/schemas/DateTime' }
        unlockedUntil: { $ref: '#/components/schemas/DateTime' }
        unlockReason: { type: string }
    UserRef:
      type: object
      required: [id, name, email]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        email: { type: string, format: email }
        title: { type: string }
        departmentId: { $ref: '#/components/schemas/Id' }

    # ── M01 ──
    Me:
      type: object
      required: [user, systemRoles, drives, csrfToken, limits]
      properties:
        user: { $ref: '#/components/schemas/User' }
        systemRoles: { type: array, items: { $ref: '#/components/schemas/SystemRole' } }
        departmentId: { $ref: '#/components/schemas/Id' }
        drives:
          type: array
          items:
            type: object
            required: [driveId, name, role, securityLevel]
            properties:
              driveId: { type: string }
              departmentId: { $ref: '#/components/schemas/Id' }
              name: { type: string, example: 11 MKT }
              role: { $ref: '#/components/schemas/DriveRole' }
              securityLevel: { $ref: '#/components/schemas/SecurityLevel' }
        blockId: { $ref: '#/components/schemas/Id', description: 'Khối tôi làm giám đốc (D12)' }
        limits:
          type: object
          description: 'Con số cấu hình để FE báo trước; BE vẫn là nơi quyết định (D12)'
          required: [shareMaxDays, backdateWorkingDays, approvalDueDays, minorUnlockDays, uploadMaxMb]
          properties:
            shareMaxDays: { type: integer, example: 30 }
            backdateWorkingDays: { type: integer, example: 3 }
            approvalDueDays: { type: integer, example: 3 }
            minorUnlockDays: { type: integer, example: 3 }
            uploadMaxMb: { type: integer, example: 100 }
        csrfToken: { type: string }
        sessionExpiresAt: { $ref: '#/components/schemas/DateTime' }
    User:
      allOf:
        - $ref: '#/components/schemas/Base'
        - $ref: '#/components/schemas/UserActions'
        - type: object
          required: [email, name, status, systemRoles]
          properties:
            email: { type: string, format: email }
            name: { type: string }
            title: { type: string, description: 'Chức danh' }
            departmentId: { $ref: '#/components/schemas/Id' }
            status: { $ref: '#/components/schemas/UserStatus' }
            systemRoles: { type: array, items: { $ref: '#/components/schemas/SystemRole' } }
            lastWorkingDay: { $ref: '#/components/schemas/Date' }
    UserPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/User' } } } }
    Drive:
      type: object
      required: [driveId, name, securityLevel]
      properties:
        driveId: { type: string }
        departmentId: { $ref: '#/components/schemas/Id' }
        name: { type: string, example: 11 MKT }
        securityLevel: { $ref: '#/components/schemas/SecurityLevel' }
        myRole: { $ref: '#/components/schemas/DriveRole', description: 'Trống khi tôi không là thành viên' }
    DriveMember:
      type: object
      required: [email, role, type]
      properties:
        permissionId: { type: string }
        email: { type: string }
        name: { type: string }
        type: { type: string, enum: [user, group, domain, anyone] }
        role: { $ref: '#/components/schemas/DriveRole' }
        viaGroup: { type: string, description: 'Email nhóm Google cấp quyền; trống = thành viên lẻ' }
        anomaly: { type: string, enum: [direct_member, foreign_member] }

    # ── M02 ──
    Block:
      allOf:
        - $ref: '#/components/schemas/Base'
        - $ref: '#/components/schemas/CatalogActions'
        - $ref: '#/components/schemas/BlockInput'
    BlockInput:
      type: object
      required: [code, name]
      properties:
        code: { type: string, example: KD }
        name: { type: string, example: Khối Kinh doanh }
        directorId: { $ref: '#/components/schemas/Id' }
    Department:
      allOf:
        - $ref: '#/components/schemas/Base'
        - $ref: '#/components/schemas/CatalogActions'
        - $ref: '#/components/schemas/DepartmentInput'
    DepartmentInput:
      type: object
      required: [code, number, name, driveId, securityLevel]
      properties:
        code: { type: string, example: MKT }
        number: { type: string, example: '11' }
        name: { type: string, example: Marketing }
        blockId: { $ref: '#/components/schemas/Id' }
        driveId: { type: string }
        securityLevel: { $ref: '#/components/schemas/SecurityLevel' }
        headId: { $ref: '#/components/schemas/Id' }
        groupEmails: { type: array, items: { type: string }, description: 'Nhóm Google gắn với drive' }
    Division:
      allOf:
        - $ref: '#/components/schemas/Base'
        - $ref: '#/components/schemas/CatalogActions'
        - $ref: '#/components/schemas/DivisionInput'
    DivisionInput:
      type: object
      required: [prefix, name]
      properties:
        prefix: { type: string, example: VCS }
        name: { type: string }
    Code:
      allOf:
        - $ref: '#/components/schemas/Base'
        - $ref: '#/components/schemas/CodeActions'
        - type: object
          required: [code, type, meaning, status]
          properties:
            code: { type: string }
            type: { $ref: '#/components/schemas/CodeType' }
            meaning: { type: string }
            scope: { type: string }
            reason: { type: string }
            departmentId: { $ref: '#/components/schemas/Id' }
            status: { $ref: '#/components/schemas/CodeStatus' }
            decision: { $ref: '#/components/schemas/Decision' }
    CodePage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Code' } } } }
    DecideInput:
      type: object
      required: [result]
      properties:
        result: { type: string, enum: [approve, reject] }
        comment: { type: string }

    # ── M03 ──
    Folder:
      allOf:
        - $ref: '#/components/schemas/Base'
        - $ref: '#/components/schemas/FolderActions'
        - type: object
          required: [driveId, googleId, number, shortName, fullName, kind, path, securityLevel, status, isManagedByVcdocs]
          properties:
            driveId: { type: string }
            googleId: { type: string }
            parentId: { $ref: '#/components/schemas/Id' }
            number: { type: string, example: '01' }
            code: { type: string, example: SEO-PTDA }
            shortName: { type: string }
            fullName: { type: string }
            kind: { $ref: '#/components/schemas/FolderKind' }
            path: { type: string, example: 11 MKT / 10 SEO / 01 SEO-PTDA }
            year: { type: integer }
            month: { type: integer, minimum: 1, maximum: 12 }
            securityLevel: { $ref: '#/components/schemas/SecurityLevel' }
            status: { $ref: '#/components/schemas/FolderStatus' }
            isManagedByVcdocs: { type: boolean }
            hasChildren: { type: boolean }

    # ── M04 ──
    DocumentCurrent:
      type: object
      properties:
        number: { type: integer, minimum: 1 }
        fileId: { type: string }
        revisionId: { type: string }
        pdfFileId: { type: string }
        pdfSha256: { type: string }
        effectiveFrom: { $ref: '#/components/schemas/Date' }
        issuedBy: { $ref: '#/components/schemas/Id' }
        approvalId: { $ref: '#/components/schemas/Id' }
    DocumentVersion:
      type: object
      required: [number, kind]
      properties:
        number: { type: integer, minimum: 1 }
        kind: { $ref: '#/components/schemas/RevisionKind' }
        changeNote: { type: string }
        approvedBy: { $ref: '#/components/schemas/Id' }
        effectiveFrom: { $ref: '#/components/schemas/Date' }
        revisionId: { type: string }
        pdfSha256: { type: string }
    DocumentSummary:
      allOf:
        - $ref: '#/components/schemas/Base'
        - $ref: '#/components/schemas/DocumentActions'
        - type: object
          required: [type, level, title, departmentId, status]
          properties:
            code: { type: string, example: QT-MKT-01 }
            type: { $ref: '#/components/schemas/DocumentType' }
            level: { $ref: '#/components/schemas/DocumentLevel' }
            title: { type: string }
            departmentId: { $ref: '#/components/schemas/Id' }
            status: { $ref: '#/components/schemas/DocumentStatus' }
            securityLevel: { $ref: '#/components/schemas/SecurityLevel' }
            drafterId: { $ref: '#/components/schemas/Id' }
            checkerId: { $ref: '#/components/schemas/Id' }
            approverId: { $ref: '#/components/schemas/Id' }
            dueDate: { $ref: '#/components/schemas/Date' }
            reviewDue: { $ref: '#/components/schemas/Date' }
            current: { $ref: '#/components/schemas/DocumentCurrent' }
            isRestricted: { type: boolean, description: 'true = tài liệu Mật, người gọi chỉ thấy mã và tên' }
    Document:
      allOf:
        - $ref: '#/components/schemas/DocumentSummary'
        - type: object
          properties:
            versions: { type: array, items: { $ref: '#/components/schemas/DocumentVersion' } }
            lock: { $ref: '#/components/schemas/Lock' }
            replacesId: { $ref: '#/components/schemas/Id' }
            replacedById: { $ref: '#/components/schemas/Id' }
            folderId: { $ref: '#/components/schemas/Id' }
            fileId: { type: string }
            external:
              type: object
              properties:
                source: { type: string }
                number: { type: string }
                issuedAt: { $ref: '#/components/schemas/Date' }
                lastCheckedAt: { $ref: '#/components/schemas/DateTime' }
                isSuperseded: { type: boolean }
                originalUrl: { type: string }
            relatedIds: { type: array, items: { $ref: '#/components/schemas/Id' } }
    DocumentPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/DocumentSummary' } } } }
    Integrity:
      type: object
      required: [isLocked, isRevisionMatching, checkedAt]
      properties:
        isLocked: { type: boolean }
        isRevisionMatching: { type: boolean, description: 'revisionId hiện tại trên Drive khớp bản hiệu lực/chốt' }
        isHashMatching: { type: boolean, description: 'Mã băm PDF khớp' }
        currentRevisionId: { type: string }
        expectedRevisionId: { type: string }
        checkedAt: { $ref: '#/components/schemas/DateTime' }

    # ── M05 ──
    Decision:
      type: object
      required: [by, at, result]
      properties:
        by: { $ref: '#/components/schemas/Id' }
        at: { $ref: '#/components/schemas/DateTime' }
        result: { type: string, enum: [approve, changes_requested, reject] }
        comment: { type: string }
        device: { type: string }
        ip: { type: string }
    Approval:
      allOf:
        - $ref: '#/components/schemas/Base'
        - $ref: '#/components/schemas/ApprovalActions'
        - type: object
          required: [objectType, objectId, submittedBy, submittedAt, approverId, status]
          properties:
            objectType: { $ref: '#/components/schemas/ApprovalObjectType' }
            objectId: { $ref: '#/components/schemas/Id' }
            objectTitle: { type: string, description: 'Tên hiển thị của đối tượng trình' }
            snapshot:
              type: object
              properties:
                revisionId: { type: string }
                pdfFileId: { type: string }
                pdfSha256: { type: string }
                takenAt: { $ref: '#/components/schemas/DateTime' }
                viewUrl: { type: string, description: 'Link xem đúng bản chụp' }
            submittedBy: { $ref: '#/components/schemas/Id' }
            submittedAt: { $ref: '#/components/schemas/DateTime' }
            approverId: { $ref: '#/components/schemas/Id' }
            approverRule: { type: string }
            checkerId: { $ref: '#/components/schemas/Id' }
            checkedAt: { $ref: '#/components/schemas/DateTime' }
            status: { $ref: '#/components/schemas/ApprovalStatus' }
            decision: { $ref: '#/components/schemas/Decision' }
            dueAt: { $ref: '#/components/schemas/DateTime' }
            reminders: { type: array, items: { $ref: '#/components/schemas/DateTime' } }
            invalidatedReason: { type: string }
            jobId: { $ref: '#/components/schemas/Id', description: 'Việc nền chạy sau quyết định, vd document.withdraw (D15)' }
    ApprovalPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Approval' } } } }
    Delegation:
      allOf:
        - $ref: '#/components/schemas/Base'
        - $ref: '#/components/schemas/CatalogActions'
        - $ref: '#/components/schemas/DelegationInput'
    DelegationInput:
      type: object
      required: [blockId, recordTypeId, delegateId, from]
      properties:
        blockId: { $ref: '#/components/schemas/Id' }
        recordTypeId: { $ref: '#/components/schemas/Id', description: 'Loại hồ sơ được uỷ quyền duyệt (D6)' }
        task: { type: string, description: 'Mô tả việc' }
        isLegalSignature: { type: boolean, default: false, description: 'Việc luật yêu cầu chữ ký người đại diện → không được uỷ quyền (422 BR-24)' }
        limitAmount: { type: number, minimum: 0, description: 'Hạn mức (VND)' }
        delegateId: { $ref: '#/components/schemas/Id' }
        from: { $ref: '#/components/schemas/Date' }
        to: { $ref: '#/components/schemas/Date' }

    # ── M06 ──
    RecordTypeInput:
      type: object
      required: [departmentId, name, kind, namingRule, folderId, keeperTitle, retentionYears, retentionBasis, disposalMethod, securityLevel]
      properties:
        departmentId: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        kind: { $ref: '#/components/schemas/RecordKind' }
        namingRule: { type: string }
        example: { type: string }
        folderId: { $ref: '#/components/schemas/Id' }
        keeperTitle: { type: string, description: 'Chức danh người giữ' }
        retentionYears: { type: integer, minimum: 0, description: '0 = vĩnh viễn', x-gia-dinh: Hợp đồng không nói cách ghi vĩnh viễn }
        retentionBasis: { type: string, description: 'Căn cứ pháp lý/nội bộ' }
        disposalMethod: { type: string }
        securityLevel: { $ref: '#/components/schemas/SecurityLevel' }
        templateId: { type: string, description: 'fileId biểu mẫu' }
        requiresApproval: { type: boolean, x-gia-dinh: 'Hợp đồng mục 5.2 nói "loại hồ sơ cần duyệt" nhưng không có trường' }
    RecordTypePatch:
      type: object
      properties:
        name: { type: string }
        namingRule: { type: string }
        example: { type: string }
        folderId: { $ref: '#/components/schemas/Id' }
        keeperTitle: { type: string }
        retentionYears: { type: integer, minimum: 0 }
        retentionBasis: { type: string }
        disposalMethod: { type: string }
        securityLevel: { $ref: '#/components/schemas/SecurityLevel' }
        templateId: { type: string }
        requiresApproval: { type: boolean }
    RecordType:
      allOf:
        - $ref: '#/components/schemas/Base'
        - $ref: '#/components/schemas/RecordTypeActions'
        - $ref: '#/components/schemas/RecordTypeInput'
        - type: object
          required: [retentionStatus]
          properties:
            retentionStatus: { type: string, enum: [draft, submitted, approved], description: 'approved mới lập được hồ sơ (BR-20)' }
            retentionApprovalId: { $ref: '#/components/schemas/Id' }

    # ── M07 ──
    RecordInput:
      type: object
      required: [recordTypeId, kind, functionCode, subject, workMonth]
      properties:
        recordTypeId: { $ref: '#/components/schemas/Id' }
        kind: { $ref: '#/components/schemas/RecordKind' }
        functionCode: { type: string, example: SEO-PTDA }
        subject: { type: string }
        identifier: { type: string, description: 'Bắt buộc khi kind = OPS' }
        workMonth: { $ref: '#/components/schemas/Month' }
        createdDate: { $ref: '#/components/schemas/Date' }
        backdateReason: { type: string, description: 'Bắt buộc khi createdDate sớm quá hạn (BR-28)' }
    RecordSummary:
      allOf:
        - $ref: '#/components/schemas/Base'
        - $ref: '#/components/schemas/RecordActions'
        - type: object
          required: [number, functionCode, kind, subject, recordTypeId, workMonth, status]
          properties:
            number: { type: string, example: HS-2026-000123 }
            functionCode: { type: string }
            kind: { $ref: '#/components/schemas/RecordKind' }
            subject: { type: string }
            identifier: { type: string }
            recordTypeId: { $ref: '#/components/schemas/Id' }
            departmentId: { $ref: '#/components/schemas/Id' }
            workMonth: { $ref: '#/components/schemas/Month' }
            createdDate: { $ref: '#/components/schemas/Date' }
            fileName: { type: string }
            folderId: { $ref: '#/components/schemas/Id' }
            fileId: { type: string }
            mimeType: { type: string }
            status: { $ref: '#/components/schemas/RecordStatus' }
            isApproved: { type: boolean, description: 'Đã được duyệt, chờ người lập chốt (mục 5.2)' }
            isClaimed: { type: boolean }
    Record:
      allOf:
        - $ref: '#/components/schemas/RecordSummary'
        - type: object
          properties:
            approvalId: { $ref: '#/components/schemas/Id' }
            finalized:
              type: object
              properties:
                at: { $ref: '#/components/schemas/DateTime' }
                by: { $ref: '#/components/schemas/Id' }
                revisionId: { type: string }
                pdfFileId: { type: string }
                pdfSha256: { type: string }
                vaultKey: { type: string }
                verifyCode: { type: string }
            lock: { $ref: '#/components/schemas/Lock' }
            paperLocation: { type: string }
            hold:
              type: object
              properties:
                isActive: { type: boolean }
                reasonType: { $ref: '#/components/schemas/HoldReasonType' }
                reason: { type: string }
                by: { $ref: '#/components/schemas/Id' }
                at: { $ref: '#/components/schemas/DateTime' }
            retention:
              type: object
              properties:
                years: { type: integer }
                basis: { type: string }
                until: { $ref: '#/components/schemas/Date' }
            adjustsId: { $ref: '#/components/schemas/Id' }
            adjustedByIds: { type: array, items: { $ref: '#/components/schemas/Id' } }
            backdateReason: { type: string }
    RecordPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/RecordSummary' } } } }
    DriveFile:
      type: object
      required: [fileId, name, mimeType]
      properties:
        fileId: { type: string }
        name: { type: string }
        mimeType: { type: string }
        driveId: { type: string }
        parentGoogleId: { type: string }
        createdTime: { $ref: '#/components/schemas/DateTime' }
        ownerEmail: { type: string }
        webViewLink: { type: string }

    # ── M08 ──
    SearchHit:
      type: object
      required: [objectType, id, title]
      properties:
        objectType: { type: string, enum: [document, record] }
        id: { $ref: '#/components/schemas/Id' }
        code: { type: string, description: 'Mã tài liệu hoặc số hồ sơ' }
        title: { type: string }
        status: { type: string }
        departmentId: { $ref: '#/components/schemas/Id' }
        workMonth: { $ref: '#/components/schemas/Month' }
        identifier: { type: string }
    SearchPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/SearchHit' } } } }

    # ── M09 ──
    ExternalShare:
      allOf:
        - $ref: '#/components/schemas/Base'
        - $ref: '#/components/schemas/ExternalShareActions'
        - type: object
          required: [fileId, email, role, status, source]
          description: 'reason, expiresAt bắt buộc khi source = vcdocs; trống được khi source = detected (D7)'
          properties:
            fileId: { type: string }
            fileName: { type: string }
            recordId: { $ref: '#/components/schemas/Id' }
            documentId: { $ref: '#/components/schemas/Id' }
            departmentId: { $ref: '#/components/schemas/Id' }
            email: { type: string, format: email }
            role: { $ref: '#/components/schemas/ShareRole' }
            reason: { type: string }
            expiresAt: { $ref: '#/components/schemas/DateTime' }
            sharedBy: { $ref: '#/components/schemas/Id' }
            approvalId: { $ref: '#/components/schemas/Id' }
            permissionId: { type: string }
            status: { $ref: '#/components/schemas/ShareStatus' }
            revokedAt: { $ref: '#/components/schemas/DateTime' }
            revokedBy: { $ref: '#/components/schemas/Id' }
            source: { type: string, enum: [vcdocs, detected] }
            detectedAt: { $ref: '#/components/schemas/DateTime' }
    ExternalSharePage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/ExternalShare' } } } }

    # ── M14 ──
    Notification:
      type: object
      required: [id, type, title, createdAt, isRead]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        type: { type: string, description: 'Ví dụ approval_pending, approval_decided, document_issued, share_expiring, job_done, job_failed' }
        title: { type: string }
        body: { type: string }
        link: { type: string, description: 'Đường dẫn trong giao diện' }
        objectType: { type: string }
        objectId: { $ref: '#/components/schemas/Id' }
        createdAt: { $ref: '#/components/schemas/DateTime' }
        isRead: { type: boolean }
    NotificationPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items, unreadCount]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/Notification' } }
            unreadCount: { type: integer, minimum: 0 }
    NotificationSettings:
      type: object
      required: [channels, digest]
      properties:
        channels: { type: array, items: { $ref: '#/components/schemas/NotificationChannel' } }
        digest: { type: string, enum: [instant, daily], x-gia-dinh: 'Hợp đồng không liệt kê giá trị digest' }

    # ── Việc nền ──
    Job:
      allOf:
        - $ref: '#/components/schemas/Base'
        - type: object
          required: [type, status, progress, steps, requestedBy]
          properties:
            type: { type: string, enum: [document.withdraw, google.sync, codes.export, folder.create, folder.close_project, folder.ensure_periods, document.create_draft, document.issue, documents.catalog_export, external_document.import, record_types.catalog_export, record.create, record.upload, record.claim, record.finalize, record.scan, share.revoke_all] }
            status: { $ref: '#/components/schemas/JobStatus' }
            progress: { type: integer, minimum: 0, maximum: 100 }
            steps:
              type: array
              items:
                type: object
                required: [name, status]
                properties:
                  name: { type: string }
                  status: { $ref: '#/components/schemas/JobStatus' }
                  error: { type: string }
            result:
              description: 'Không có với google.sync, folder.ensure_periods, share.revoke_all (D16). Kết quả cuối (D11): { objectType, objectId } khi tạo/đổi đối tượng; { fileId } khi xuất file'
              oneOf:
                - type: object
                  required: [objectType, objectId]
                  properties:
                    objectType: { type: string, enum: [document, record, folder, approval, external_share, code, record_type] }
                    objectId: { $ref: '#/components/schemas/Id' }
                - type: object
                  required: [fileId]
                  properties:
                    fileId: { type: string }
                    url: { type: string }
            summary: { type: object, additionalProperties: true, description: 'Số liệu tóm tắt, vd { created: 12 } (D16)' }
            error: { $ref: '#/components/schemas/Error' }
            startedAt: { $ref: '#/components/schemas/DateTime' }
            finishedAt: { $ref: '#/components/schemas/DateTime' }
            requestedBy: { $ref: '#/components/schemas/Id' }
    JobPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Job' } } } }

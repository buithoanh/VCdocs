        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [M06 Danh mục hồ sơ]
      summary: Khai báo loại hồ sơ (R4) – thời hạn chưa duyệt → chưa lập được hồ sơ (BR-20)
      parameters: [{ $ref: '#/components/parameters/Csrf' }, { $ref: '#/components/parameters/Idempotency' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RecordTypeInput' } } } }
      responses:
        '201': { description: 'Đã tạo', content: { application/json: { schema: { $ref: '#/components/schemas/RecordTypeDetail' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /record-types/catalog/export:
    post:
      tags: [M06 Danh mục hồ sơ]
      summary: Xuất Danh mục hồ sơ VCPV (R3)
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      responses:
        '202': { $ref: '#/components/responses/JobAccepted' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /record-types/{id}:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      tags: [M06 Danh mục hồ sơ]
      summary: Chi tiết loại hồ sơ
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/RecordTypeDetail' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [M06 Danh mục hồ sơ]
      summary: Sửa loại hồ sơ (R4) – đổi thời hạn → retentionStatus về draft, phải trình lại
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RecordTypePatch' } } } }
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/RecordTypeDetail' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /record-types/{id}/submit-retention:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    post:
      tags: [M06 Danh mục hồ sơ]
      summary: Trình thời hạn lưu (R4) – Approval retention cho R1; kế toán thêm R8, nhân sự thêm R3
      parameters: [{ $ref: '#/components/parameters/Csrf' }, { $ref: '#/components/parameters/Idempotency' }]
      responses:
        '201': { description: 'Đã tạo phiếu', content: { application/json: { schema: { $ref: '#/components/schemas/ApprovalDetail' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ───────────────────────── M07 ─────────────────────────
  /records:
    get:
      tags: [M07 Hồ sơ]
      summary: Danh sách hồ sơ (theo quyền drive)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Sort'
        - { name: recordTypeId, in: query, schema: { $ref: '#/components/schemas/Id' } }
        - { name: departmentId, in: query, schema: { $ref: '#/components/schemas/Id' } }
        - { name: workMonth, in: query, schema: { $ref: '#/components/schemas/Month' } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/RecordStatus' } }
        - { name: kind, in: query, schema: { $ref: '#/components/schemas/RecordKind' } }
        - $ref: '#/components/parameters/Q'
        - { name: identifier, in: query, schema: { type: string } }
        - { name: createdBy, in: query, schema: { $ref: '#/components/schemas/Id' } }
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/RecordPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [M07 Hồ sơ]
      summary: Lập hồ sơ từ biểu mẫu (R4, R5, R6, R8) – tạo file, đặt tên, đặt chỗ (BR-09, BR-10, BR-28)
      parameters: [{ $ref: '#/components/parameters/Csrf' }, { $ref: '#/components/parameters/Idempotency' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RecordInput' } } } }
      responses:
        '202': { $ref: '#/components/responses/JobAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/RuleViolation' }
  /records/upload:
    post:
      tags: [M07 Hồ sơ]
      summary: Tải file lên cùng trường lập hồ sơ (R4, R5, R6, R8) – chuyển định dạng Google trừ PDF, XML, scan (BR-14)
      parameters: [{ $ref: '#/components/parameters/Csrf' }, { $ref: '#/components/parameters/Idempotency' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              allOf:
                - $ref: '#/components/schemas/RecordInput'
                - type: object
                  required: [file]
                  properties:
                    file: { type: string, format: binary, description: '≤ 100 MB' }
      responses:
        '202': { $ref: '#/components/responses/JobAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/RuleViolation' }
  /records/unregistered:
    get:
      tags: [M07 Hồ sơ]
      summary: File trên Drive chưa đăng ký (R4, R5)
      parameters:
        - { name: driveId, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/DriveFile' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /records/claim:
    post:
      tags: [M07 Hồ sơ]
      summary: Đăng ký ngược file tạo thẳng trên Drive (người tạo file, R4) – tên sai thì máy chủ đổi đúng
      parameters: [{ $ref: '#/components/parameters/Csrf' }, { $ref: '#/components/parameters/Idempotency' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileId, recordTypeId, kind, functionCode, workMonth]
              properties:
                fileId: { type: string }
                recordTypeId: { $ref: '#/components/schemas/Id' }
                kind: { $ref: '#/components/schemas/RecordKind' }
                functionCode: { type: string }
                subject: { type: string, x-gia-dinh: 'Hợp đồng không ghi; cần để ghép tên đúng' }
                identifier: { type: string }
                workMonth: { $ref: '#/components/schemas/Month' }
      responses:
        '202': { $ref: '#/components/responses/JobAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/RuleViolation' }
      x-gia-dinh: Hợp đồng không ghi kiểu trả; chọn 202 job vì phải đổi tên, di chuyển trên Drive
  /records/{id}:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      tags: [M07 Hồ sơ]
      summary: Chi tiết hồ sơ
      responses:
        '200': { $ref: '#/components/responses/RecordOk' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [M07 Hồ sơ]
      summary: Sửa hồ sơ (người lập) – chỉ khi drafting, khác → 409
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                subject: { type: string }
                identifier: { type: string }
                workMonth: { $ref: '#/components/schemas/Month' }
                paperLocation: { type: string }
      responses:
        '200': { $ref: '#/components/responses/RecordOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /records/{id}/submit:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    post:
      tags: [M07 Hồ sơ]
      summary: Trình duyệt hồ sơ (người lập) – khoá tạm, chụp phiên bản
      parameters: [{ $ref: '#/components/parameters/Csrf' }, { $ref: '#/components/parameters/Idempotency' }]
      responses:
        '200': { $ref: '#/components/responses/RecordOk' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/RuleViolation' }
  /records/{id}/finalize:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    post:
      tags: [M07 Hồ sơ]
      summary: Chốt (người lập, R4) – PDF + dấu chốt + QR, khoá, mã băm, kho riêng (BR-13, BR-26, BR-29)
      parameters: [{ $ref: '#/components/parameters/Csrf' }, { $ref: '#/components/parameters/Idempotency' }]
      responses:
        '202': { $ref: '#/components/responses/JobAccepted' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/RuleViolation' }
  /records/{id}/adjust:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    post:
      tags: [M07 Hồ sơ]
      summary: Tạo hồ sơ Điều chỉnh (R5, R6) – trả record mới có adjustsId
      parameters: [{ $ref: '#/components/parameters/Csrf' }, { $ref: '#/components/parameters/Idempotency' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [reason], properties: { reason: { type: string } } }
      responses:
        '201': { $ref: '#/components/responses/RecordOk201' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /records/{id}/scan:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    post:
      tags: [M07 Hồ sơ]
      summary: Gắn bản scan (người lập) – ghi vị trí giấy vào Mô tả file
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, paperLocation]
              properties:
                file: { type: string, format: binary, description: '≤ 100 MB' }
                paperLocation: { type: string }
      responses:
        '202': { $ref: '#/components/responses/JobAccepted' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
      x-gia-dinh: Hợp đồng không ghi kiểu trả; chọn 202 job vì phải tải file lên Drive
  /records/{id}/hold:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    post:
      tags: [M07 Hồ sơ]
      summary: Giữ lại, không được huỷ (R4, R1, R8) finalized → held (BR-22)
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [reasonType, reason], properties: { reasonType: { $ref: '#/components/schemas/HoldReasonType' }, reason: { type: string, description: 'Diễn giải' } } }
      responses:
        '200': { $ref: '#/components/responses/RecordOk' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/RuleViolation' }
  /records/{id}/release-hold:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    post:
      tags: [M07 Hồ sơ]
      summary: Bỏ giữ lại (R4, R1, R8) held → finalized
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      responses:
        '200': { $ref: '#/components/responses/RecordOk' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /records/{id}/integrity:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      tags: [M07 Hồ sơ]
      summary: Khoá, mã băm, phiên bản có khớp (R3, R4)
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/Integrity' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/DriveError' }
  /verify/{verifyCode}:
    parameters:
      - { name: verifyCode, in: path, required: true, schema: { type: string } }
    get:
      tags: [M07 Hồ sơ]
      summary: Tra mã trên dấu chốt (QR) – đã đăng nhập, không cần quyền drive; không trả nội dung
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [number, status, finalizedAt, pdfSha256]
                properties:
                  number: { type: string, example: HS-2026-000123 }
                  status: { $ref: '#/components/schemas/RecordStatus' }
                  finalizedAt: { $ref: '#/components/schemas/DateTime' }
                  pdfSha256: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────── M08 ─────────────────────────
  /search:
    get:
      tags: [M08 Tra cứu]
      summary: Tìm theo mã, tên, số định danh – chỉ trả thứ được xem; ≤ 2 giây
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1 } }
        - { name: scope, in: query, schema: { type: string, enum: [all, documents, records], default: all }, x-gia-dinh: 'Hợp đồng không liệt kê giá trị scope' }
        - { name: departmentId, in: query, schema: { $ref: '#/components/schemas/Id' } }
        - { name: workMonth, in: query, schema: { $ref: '#/components/schemas/Month' } }
        - { name: status, in: query, schema: { type: string } }
        - { name: createdBy, in: query, schema: { $ref: '#/components/schemas/Id' } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/SearchPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooMany' }
  /search/suggest:
    get:
      tags: [M08 Tra cứu]
      summary: Gợi ý khi gõ
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1 } }
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, maxItems: 10, items: { $ref: '#/components/schemas/SearchHit' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooMany' }
      x-gia-dinh: 'Giới hạn tìm kiếm 60/phút áp cả cho gợi ý'

  # ───────────────────────── M09 ─────────────────────────
  /external-shares:
    get:
      tags: [M09 Chia sẻ ngoài]
      summary: Sổ chia sẻ ngoài (R4 phòng mình, R3; người chia sẻ)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Sort'
        - { name: departmentId, in: query, schema: { $ref: '#/components/schemas/Id' } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ShareStatus' } }
        - { name: fileId, in: query, schema: { type: string } }
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/ExternalSharePage' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [M09 Chia sẻ ngoài]
      summary: Chia sẻ ra ngoài (R5, R6, R8) – tài khoản máy thực hiện; file Mật → pending_approval (R4); hạn có giới hạn (BR-17)
      parameters: [{ $ref: '#/components/parameters/Csrf' }, { $ref: '#/components/parameters/Idempotency' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileId, email, role, reason, expiresAt]
              properties:
                fileId: { type: string }
                email: { type: string, format: email }
                role: { $ref: '#/components/schemas/ShareRole' }
                reason: { type: string }
                expiresAt: { $ref: '#/components/schemas/DateTime' }
      responses:
        '201': { $ref: '#/components/responses/ExternalShareOk201' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/RuleViolation' }
        '502': { $ref: '#/components/responses/DriveError' }
  /external-shares/revoke-all:
    post:
      tags: [M09 Chia sẻ ngoài]
      summary: Gỡ hết chia sẻ ngoài của phòng (R4)
      parameters:
        - $ref: '#/components/parameters/Csrf'
        - { name: departmentId, in: query, required: true, schema: { $ref: '#/components/schemas/Id' } }
      responses:
        '202': { $ref: '#/components/responses/JobAccepted' }
        '403': { $ref: '#/components/responses/Forbidden' }
      x-gia-dinh: Hợp đồng không ghi kiểu trả; chọn 202 job vì có thể gỡ nhiều quyền
  /external-shares/anomalies:
    get:
      tags: [M09 Chia sẻ ngoài]
      summary: Chia sẻ trong nhật ký Google không có trong sổ (R4, R3)
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/ExternalShare' } } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /external-shares/{id}/revoke:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    post:
      tags: [M09 Chia sẻ ngoài]
      summary: Gỡ chia sẻ (người chia sẻ, R4)
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      responses:
        '200': { $ref: '#/components/responses/ExternalShareOk' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '502': { $ref: '#/components/responses/DriveError' }
  /external-shares/{id}/extend:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    post:
      tags: [M09 Chia sẻ ngoài]
      summary: Gia hạn chia sẻ (người chia sẻ, R4)
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [expiresAt], properties: { expiresAt: { $ref: '#/components/schemas/DateTime' } } }
      responses:
        '200': { $ref: '#/components/responses/ExternalShareOk' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/RuleViolation' }

  # ───────────────────────── M14 ─────────────────────────
  /notifications:
    get:
      tags: [M14 Thông báo]
      summary: Thông báo trong ứng dụng
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - { name: unread, in: query, schema: { type: boolean } }
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/NotificationPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /notifications/{id}/read:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    post:
      tags: [M14 Thông báo]
      summary: Đánh dấu đã đọc
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      responses:
        '204': { description: 'OK' }
        '404': { $ref: '#/components/responses/NotFound' }
  /notifications/read-all:
    post:
      tags: [M14 Thông báo]
      summary: Đánh dấu tất cả đã đọc
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      responses:
        '204': { description: 'OK' }
  /notification-settings:
    get:
      tags: [M14 Thông báo]
      summary: Kênh nhận thông báo của tôi
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/NotificationSettings' } } } }
    patch:
      tags: [M14 Thông báo]
      summary: Đổi kênh nhận (zalo từ giai đoạn 3 → 422 nếu bật sớm)
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NotificationSettings' } } } }
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/NotificationSettings' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/RuleViolation' }

  # ───────────────────────── Flow VCworkspace (chat14) ─────────────────────────
  /flow/nextcloud/webhooks:
    post:
      tags: [Flow VCworkspace]
      summary: Nhận event từ Nextcloud webhook_listeners (endpoint nội bộ)
      description: |
        Chỉ Nextcloud gọi, qua mạng nội bộ. Xác thực bằng header bí mật X-VCW-Flow-Token
        (so thời gian hằng; nhiều bí mật còn hiệu lực trong lúc xoay vòng), không dùng phiên
        hay CSRF. Thân là payload webhook_listeners nguyên bản; Nextcloud gửi không kèm
        Content-Type nên máy chủ đọc mọi kiểu thân là JSON (tối đa 256 KB).

        Allowlist lớp event: OCA\Forms\Events\FormSubmittedEvent; OCA\Tables\Event\Row{Added,Updated,Deleted}Event;
        OCP\Files\Events\Node\Node{Created,Written,Deleted,Renamed}Event. Lớp khác → 422 RULE_VIOLATION (rule FLOW-01).
        Máy chủ chỉ lấy lớp event, id số nguyên, time và user.uid để định tuyến; dữ liệu nghiệp vụ
        luôn đọc lại qua API bằng quyền người chạy flow, không tin payload, không tải URL trong payload.

        Idempotency theo (lớp event, tài nguyên, time): gửi lại/replay trả 202 duplicate=true, không tạo
        việc mới. Xử lý chạy nền theo thứ tự từng tài nguyên; companyId lấy từ cấu hình máy chủ.
      security: [{ flowWebhookToken: [] }]
      parameters:
        - { name: X-VCW-Flow-Token, in: header, required: true, schema: { type: string, minLength: 32, maxLength: 256 } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FlowNextcloudWebhook' } } } }
      responses:
        '202':
          description: Đã ghi journal (hoặc đã có từ trước nếu duplicate=true); xử lý chạy nền
          headers: { X-Audit-Id: { $ref: '#/components/headers/AuditId' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/FlowWebhookAccepted' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '422': { $ref: '#/components/responses/RuleViolation' }
        '503': { description: Flow chưa bật trên máy chủ (MAINTENANCE), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /flow/events:
    get:
      tags: [Flow VCworkspace]
      summary: R9 xem journal event Flow (trạng thái, số lần thử, replay, độ trễ, kết quả từng rule)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Sort'
        - { name: status, in: query, schema: { $ref: '#/components/schemas/FlowEventStatus' } }
        - { name: ruleId, in: query, schema: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,63}$' } }
        - { name: resourceKey, in: query, schema: { type: string, maxLength: 200 } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/FlowEventPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /flow/events/{id}:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      tags: [Flow VCworkspace]
      summary: R9 đọc một event Flow và id tương quan audit
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/FlowEvent' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────── Việc nền ─────────────────────────
  /jobs:
    get:
      tags: [Việc nền]
      summary: Danh sách việc chạy lâu (mine=true chỉ của tôi; R9 xem tất cả)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - { name: mine, in: query, schema: { type: boolean, default: true } }
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/JobPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /jobs/{id}:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      tags: [Việc nền]
      summary: Theo dõi một việc chạy lâu (người yêu cầu, R9)
      responses:
        '200': { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/JobDetail' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────── Email cơ bản VCworkspace ─────────────────────────
  /mail/messages:
    get:
      tags: [Quản lý Email]
      summary: Danh sách hoặc tìm thư trong mailbox người dùng được đọc
      parameters:
        - { name: mailbox, in: query, schema: { type: string, format: email }, description: 'Bỏ trống = mailbox cá nhân; mailbox nhóm cần quyền read' }
        - { name: folder, in: query, schema: { type: string, default: inbox }, description: 'Thư mục logic; nhãn độc lập với thư mục' }
        - { name: q, in: query, schema: { type: string, maxLength: 200 }, description: 'Tìm trong from, subject hoặc body MIME' }
        - { name: scope, in: query, schema: { type: string, enum: [all, from, subject, body], default: all } }
        - { name: label, in: query, schema: { type: string, maxLength: 80 } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/MailMessage' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /mail/threads/{id}:
    get:
      tags: [Email cơ bản]
      summary: Đọc hội thoại trong chính mailbox người đăng nhập
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }, { name: mailbox, in: query, schema: { type: string, format: email } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, required: [id, items], properties: { id: { type: string }, items: { type: array, items: { $ref: '#/components/schemas/MailMessage' } } } } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /mail/drafts:
    post:
      tags: [Email cơ bản]
      summary: Tạo bản nháp trong chính mailbox người đăng nhập
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MailCompose' } } } }
      responses:
        '201': { description: Đã lưu nháp, headers: { X-Audit-Id: { $ref: '#/components/headers/AuditId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/MailDraft' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /mail/drafts/{id}:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      tags: [Email cơ bản]
      summary: Mở lại bản nháp của chính người đăng nhập
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/MailDraft' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Email cơ bản]
      summary: Lưu thay đổi bản nháp của chính người đăng nhập
      parameters: [{ $ref: '#/components/parameters/Csrf' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MailCompose' } } } }
      responses:
        '200': { description: Đã lưu, headers: { X-Audit-Id: { $ref: '#/components/headers/AuditId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/MailDraft' } } } }
  /mail/send:
    post:
      tags: [Email cơ bản]
      summary: Gửi thư nội bộ và chỉ trả thành công sau mail server ACK
      parameters: [{ $ref: '#/components/parameters/Csrf' }, { $ref: '#/components/parameters/Idempotency' }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/MailCompose' } }
          multipart/form-data: { schema: { type: object, required: [to, subject, text], properties: { to: { type: string, description: 'JSON array địa chỉ nội bộ' }, subject: { type: string }, text: { type: string }, html: { type: string }, draftId: { type: string }, inReplyTo: { type: string }, references: { type: string, description: 'JSON array Message-ID' }, attachments: { type: array, maxItems: 8, items: { type: string, format: binary } } } } }
      responses:
        '201': { description: Mail server đã nhận, headers: { X-Audit-Id: { $ref: '#/components/headers/AuditId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/MailMessage' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/StorageUnavailable' }
  /mail/messages/{id}/raw:
    get:
      tags: [Email cơ bản]
      summary: Tải raw MIME của thư trong chính mailbox người đăng nhập
      parameters: [{ $ref: '#/components/parameters/IdPath' }, { name: mailbox, in: query, schema: { type: string, format: email }, description: 'Bắt buộc khi đọc shared mailbox' }]
      responses:
        '200': { description: MIME nguyên bản, content: { message/rfc822: { schema: { type: string, format: binary } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /mail/messages/{id}/labels:
    patch:
      tags: [Quản lý Email]
      summary: Thay toàn bộ nhãn nghiệp vụ của thư, không đổi thư mục
      parameters: [{ $ref: '#/components/parameters/IdPath' }, { $ref: '#/components/parameters/Csrf' }, { name: mailbox, in: query, schema: { type: string, format: email } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [labels], properties: { labels: { type: array, maxItems: 20, uniqueItems: true, items: { type: string, minLength: 1, maxLength: 80 } } } } } } }
      responses:
        '200': { description: Đã lưu nhãn, headers: { X-Audit-Id: { $ref: '#/components/headers/AuditId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/MailMessage' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /mail/labels:
    get:
      tags: [Quản lý Email]
      summary: Danh sách nhãn trong mailbox được đọc
      parameters: [{ name: mailbox, in: query, schema: { type: string, format: email } }]
      responses: { '200': { description: OK, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/MailLabel' } } } } } } } }
    post:
      tags: [Quản lý Email]
      summary: Tạo nhãn dùng được cho nhiều thư
      parameters: [{ $ref: '#/components/parameters/Csrf' }, { $ref: '#/components/parameters/Idempotency' }, { name: mailbox, in: query, schema: { type: string, format: email } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string, minLength: 1, maxLength: 80 }, color: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' } } } } } }
      responses:
        '201': { description: Đã tạo, headers: { X-Audit-Id: { $ref: '#/components/headers/AuditId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/MailLabel' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /mail/filters:
    get:
      tags: [Quản lý Email]
      summary: Danh sách bộ lọc thư đến
      responses: { '200': { description: OK, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/MailFilter' } } } } } } } }
    post:
      tags: [Quản lý Email]
      summary: Tạo bộ lọc hữu hạn, không chuyển tiếp hoặc tự sinh thư
      parameters: [{ $ref: '#/components/parameters/Csrf' }, { $ref: '#/components/parameters/Idempotency' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MailFilterInput' } } } }
      responses:
        '201': { description: Đã tạo, headers: { X-Audit-Id: { $ref: '#/components/headers/AuditId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/MailFilter' } } } }
  /mail/filters/{id}:
    patch:
      tags: [Quản lý Email]
      summary: Bật, tắt hoặc sửa bộ lọc của chính người dùng
      parameters: [{ $ref: '#/components/parameters/IdPath' }, { $ref: '#/components/parameters/Csrf' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MailFilterInput' } } } }
      responses:
        '200': { description: Đã cập nhật, headers: { X-Audit-Id: { $ref: '#/components/headers/AuditId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/MailFilter' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /mail/aliases:
    get:
      tags: [Quản lý Email]
      summary: Danh tính gửi cá nhân và alias; không gồm shared mailbox
      responses: { '200': { description: OK, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/MailAlias' } } } } } } } }
    post:
      tags: [Quản lý Email]
      summary: Tạo alias gửi cho chính người dùng, không tạo mailbox dùng chung
      parameters: [{ $ref: '#/components/parameters/Csrf' }, { $ref: '#/components/parameters/Idempotency' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [address], properties: { address: { type: string, format: email }, displayName: { type: string, maxLength: 120 } } } } } }
      responses:
        '201': { description: Đã tạo alias, headers: { X-Audit-Id: { $ref: '#/components/headers/AuditId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/MailAlias' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /mail/shared-mailboxes:
    get:
      tags: [Quản lý Email]
      summary: Danh sách hộp thư nhóm người dùng đang là thành viên
      responses: { '200': { description: OK, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/SharedMailbox' } } } } } } } }
    post:
      tags: [Quản lý Email]
      summary: Tạo hộp thư nhóm; người tạo có read, send và manage
      parameters: [{ $ref: '#/components/parameters/Csrf' }, { $ref: '#/components/parameters/Idempotency' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [address, name], properties: { address: { type: string, format: email }, name: { type: string, minLength: 1, maxLength: 120 } } } } } }
      responses:
        '201': { description: Đã tạo, headers: { X-Audit-Id: { $ref: '#/components/headers/AuditId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/SharedMailbox' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /mail/shared-mailboxes/{id}/members:
    patch:
      tags: [Quản lý Email]
      summary: Cấp hoặc thu hồi thành viên; roles rỗng là thu hồi ngay
      parameters: [{ $ref: '#/components/parameters/IdPath' }, { $ref: '#/components/parameters/Csrf' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [email, roles], properties: { email: { type: string, format: email }, roles: { type: array, uniqueItems: true, description: "Quyền gửi bắt buộc đi cùng quyền đọc; quyền manage có thể độc lập.", items: { type: string, enum: [read, send, manage] } } } } } } }
      responses:
        '200': { description: Đã cập nhật quyền, headers: { X-Audit-Id: { $ref: '#/components/headers/AuditId' } }, content: { application/json: { schema: { $ref: '#/components/schemas/SharedMailbox' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /mail/offboarding/{userId}:
    post:
      tags: [Quản lý Email]
      summary: Khoá đăng nhập mail, thu hồi alias, quyền hộp thư nhóm và phiên của người nghỉ việc
      description: Chỉ HCNS hoặc quản trị hệ thống. Thao tác yêu cầu mail engine xác nhận trước khi đánh dấu người dùng đã nghỉ.
      parameters: [{ name: userId, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/Csrf' }, { $ref: '#/components/parameters/Idempotency' }]
      responses:
        '201': { description: Đã thu hồi, headers: { X-Audit-Id: { $ref: '#/components/headers/AuditId' } }, content: { application/json: { schema: { type: object, required: [userId, address, status], properties: { userId: { type: string }, address: { type: string, format: email }, status: { type: string, enum: [left] } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/StorageUnavailable' }
  /mail/messages/{messageId}/attachments/{part}/save-to-drive:
    post:
      tags: [Liên thông Email–Drive–Office]
      summary: Lưu đúng attachment MIME vào thư mục Drive đã có quyền ghi
      description: Đọc raw MIME từ mailbox đã được cấp quyền; part là chỉ số attachment theo thứ tự parser. Retry cùng Idempotency-Key không tạo file trùng; cùng key nhưng đổi source message, part, mailbox hoặc đích Drive trả 409. Tệp lưu giữ provenance message/part/hash.
      parameters:
        - { name: messageId, in: path, required: true, schema: { type: string } }
        - { name: part, in: path, required: true, schema: { type: integer, minimum: 0 } }
        - { name: mailbox, in: query, schema: { type: string, format: email } }
        - { $ref: '#/components/parameters/Csrf' }
        - { $ref: '#/components/parameters/Idempotency' }
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [spaceId], properties: { spaceId: { $ref: '#/components/schemas/Id' }, parentId: { $ref: '#/components/schemas/Id' }, expectedSha256: { type: string, pattern: '^[0-9a-f]{64}$' } } } } } }
      responses:
        '201': { description: Attachment đã được ghi bền vững vào Drive, content: { application/json: { schema: { $ref: '#/components/schemas/WorkspaceDriveFile' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '503': { $ref: '#/components/responses/StorageUnavailable' }
  /mail/send-drive-file:
    post:
      tags: [Liên thông Email–Drive–Office]
      summary: Gửi snapshot một version Drive hoặc link cần đăng nhập tới đúng version
      description: Attachment là snapshot bất biến của versionId/hash lúc compose. Link không tự cấp quyền; mọi người nhận phải có ACL đọc sẵn và vẫn phải đăng nhập khi tải. Idempotency-Key bind toàn payload; đổi file/version/hash/người nhận/nội dung với cùng key trả 409, kể cả sau crash hoặc request đồng thời. Email link dùng URL tuyệt đối của web app; token nằm trong fragment để không đi vào access log, web app giữ returnTo qua đăng nhập rồi mới gọi API tải.
      parameters: [{ $ref: '#/components/parameters/Csrf' }, { $ref: '#/components/parameters/Idempotency' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [to, subject, fileId, versionId, expectedSha256, mode], properties: { to: { type: array, minItems: 1, maxItems: 50, items: { type: string, format: email } }, subject: { type: string, maxLength: 300 }, text: { type: string }, fromIdentity: { type: string, format: email }, fileId: { $ref: '#/components/schemas/Id' }, versionId: { $ref: '#/components/schemas/Id' }, expectedSha256: { type: string, pattern: '^[0-9a-f]{64}$' }, mode: { type: string, enum: [attachment, link] } } } } } }
      responses:
        '201': { description: Mail engine đã ACK; version/hash gửi được cố định trong journal, content: { application/json: { schema: { $ref: '#/components/schemas/MailMessage' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/StorageUnavailable' }
  /drive/shared-links/{token}:
    get:
      tags: [Liên thông Email–Drive–Office]
      summary: Tải đúng version qua link có xác thực và ACL người nhận
      parameters: [{ name: token, in: path, required: true, schema: { type: string, minLength: 20, maxLength: 100 } }]
      responses:
        '200': { description: Nội dung version bất biến, headers: { X-Content-SHA256: { schema: { type: string } } }, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: vcdocs_sid
      description: Cookie phiên HttpOnly, Secure, SameSite=Lax, 8 giờ, tự gia hạn khi đang dùng (hợp đồng mục 8, Q4)
      x-gia-dinh: Tên cookie do file này chọn
    flowWebhookToken:
      type: apiKey
      in: header
      name: X-VCW-Flow-Token
      description: Bí mật dùng chung giữa Nextcloud webhook_listeners (authMethod header) và máy chủ; xoay vòng bằng cách nhận song song bản mới và bản cũ

  parameters:
    IdPath: { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
    Sort: { name: sort, in: query, description: 'Ví dụ -createdAt,title (dấu trừ = giảm dần)', schema: { type: string } }
    Q: { name: q, in: query, description: 'Tìm theo chữ', schema: { type: string } }
    Csrf: { name: X-CSRF-Token, in: header, required: true, schema: { type: string } }
    Idempotency: { name: Idempotency-Key, in: header, required: true, description: 'Chuỗi ngẫu nhiên do FE sinh; giữ 24 giờ và bind toàn method/path/payload. Lặp đúng payload trả kết quả cũ; cùng key khác payload trả 409.', schema: { type: string, minLength: 8, maxLength: 128 } }

  headers:
    RequestId: { description: 'Trả lại X-Request-Id của yêu cầu', schema: { type: string } }
    AuditId: { description: 'Id dòng audit_logs vừa ghi', schema: { type: string } }

  responses:
    JobAccepted:
      description: Đã nhận, chạy nền
      headers:
        X-Audit-Id: { $ref: '#/components/headers/AuditId' }
      content:
        application/json:
          schema: { type: object, required: [jobId], properties: { jobId: { $ref: '#/components/schemas/Id' } } }
    UserOk: { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
    DocumentOk: { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/DocumentDetail' } } } }
    DocumentOk201: { description: 'Đã tạo', content: { application/json: { schema: { $ref: '#/components/schemas/DocumentDetail' } } } }
    RecordOk: { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/RecordDetail' } } } }
    RecordOk201: { description: 'Đã tạo', content: { application/json: { schema: { $ref: '#/components/schemas/RecordDetail' } } } }
    ApprovalOk: { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/ApprovalDetail' } } } }
    ExternalShareOk: { description: 'OK', content: { application/json: { schema: { $ref: '#/components/schemas/ExternalShareDetail' } } } }
    ExternalShareOk201: { description: 'Đã tạo', content: { application/json: { schema: { $ref: '#/components/schemas/ExternalShareDetail' } } } }
    BadRequest: { description: 'Dữ liệu sai (VALIDATION)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Unauthorized: { description: 'Chưa đăng nhập', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Forbidden: { description: 'Không có quyền (FORBIDDEN)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    NotFound: { description: 'Không có, hoặc thuộc drive Mật không được xem (NOT_FOUND)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Conflict: { description: 'Trùng hoặc sai trạng thái (STATE_INVALID, DUPLICATE)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    RuleViolation: { description: 'Vi phạm quy tắc nghiệp vụ (RULE_VIOLATION, kèm rule = mã BR)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Locked: { description: 'File đang khoá (LOCKED)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    TooMany: { description: 'Quá nhiều yêu cầu (600/phút/người; tìm kiếm 60/phút)', headers: { Retry-After: { description: 'Số giây chờ trước khi gọi lại', schema: { type: integer, minimum: 1 } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    PayloadTooLarge: { description: 'Thân JSON > 1 MB hoặc file > 100 MB', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    DriveError: { description: 'Google trả lỗi (DRIVE_ERROR)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    StorageConflict: { description: 'Tên đã tồn tại hoặc kho từ chối ghi đè (STORAGE_CONFLICT)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    WorkspacePayloadTooLarge: { description: 'Tệp Drive cơ bản lớn hơn 10 MiB (PAYLOAD_TOO_LARGE)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    UnsupportedMediaType: { description: 'Loại tệp chưa được phép trong giai đoạn thử (UNSUPPORTED_MEDIA_TYPE)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    StorageIntegrityMismatch: { description: 'Checksum đọc lại không khớp nội dung đã nhận (STORAGE_INTEGRITY_MISMATCH)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    StorageUnavailable: { description: 'Kho tạm thời không sẵn sàng (STORAGE_UNAVAILABLE)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    StorageTimeout: { description: 'Kho không phản hồi trong thời hạn (STORAGE_TIMEOUT)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  schemas:
    MailCompose:
      type: object
      properties:
        to: { type: array, items: { type: string, format: email }, maxItems: 50 }
        subject: { type: string, maxLength: 300 }
        text: { type: string }
        html: { type: string }
        draftId: { $ref: '#/components/schemas/Id' }
        inReplyTo: { type: string }
        references: { type: array, items: { type: string } }
        attachments: { type: array, maxItems: 8, items: { type: object, required: [filename, contentBase64], properties: { filename: { type: string }, contentType: { type: string }, contentBase64: { type: string } } } }
        fromIdentity: { type: string, format: email, description: 'Alias hoặc địa chỉ shared mailbox đã được cấp quyền gửi' }
        mailbox: { type: string, format: email, description: 'Mailbox nghiệp vụ khi gửi thay hộp thư nhóm' }
    MailDraft:
      allOf:
        - { $ref: '#/components/schemas/MailCompose' }
        - { type: object, required: [id, ownerEmail, createdAt, updatedAt], properties: { id: { $ref: '#/components/schemas/Id' }, ownerEmail: { type: string, format: email }, attachmentNames: { type: array, items: { type: string } }, createdAt: { $ref: '#/components/schemas/DateTime' }, updatedAt: { $ref: '#/components/schemas/DateTime' } } }
    MailMessage:
      type: object
      required: [id, mailboxOwner, threadId, from, to, subject, sentAt, folder, deliveryStatus]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        mailboxOwner: { type: string, format: email }
        threadId: { type: string }
        from: { type: string, format: email }
        to: { type: array, items: { type: string, format: email } }
        subject: { type: string }
        sentAt: { $ref: '#/components/schemas/DateTime' }
        folder: { type: string }
        labels: { type: array, uniqueItems: true, items: { type: string } }
        deliveryStatus: { type: string, enum: [accepted, failed] }
        inReplyTo: { type: string }
        preview: { type: string }
        attachmentCount: { type: integer, minimum: 0 }
    MailLabel:
      type: object
      required: [id, ownerEmail, name, color, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        ownerEmail: { type: string, format: email }
        name: { type: string }
        color: { type: string }
        createdAt: { $ref: '#/components/schemas/DateTime' }
        updatedAt: { $ref: '#/components/schemas/DateTime' }
    MailFilterInput:
      type: object
      required: [name, field, operator, value]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        field: { type: string, enum: [from, to, subject, body] }
        operator: { type: string, enum: [equals, contains] }
        value: { type: string, minLength: 1, maxLength: 200 }
        addLabels: { type: array, maxItems: 20, uniqueItems: true, items: { type: string, minLength: 1, maxLength: 80 } }
        moveToFolder: { type: string, maxLength: 80 }
        stop: { type: boolean, default: false }
        enabled: { type: boolean, default: true }
    MailFilter:
      allOf:
        - { $ref: '#/components/schemas/MailFilterInput' }
        - { type: object, required: [id, ownerEmail, enabled, createdAt, updatedAt], properties: { id: { $ref: '#/components/schemas/Id' }, ownerEmail: { type: string, format: email }, createdAt: { $ref: '#/components/schemas/DateTime' }, updatedAt: { $ref: '#/components/schemas/DateTime' } } }
    MailAlias:
      type: object
      required: [id, ownerEmail, address, displayName, active, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        ownerEmail: { type: string, format: email }
        address: { type: string, format: email }
        displayName: { type: string }
        active: { type: boolean }
        createdAt: { $ref: '#/components/schemas/DateTime' }
        updatedAt: { $ref: '#/components/schemas/DateTime' }
    SharedMailbox:
      type: object
      required: [id, address, name, members, currentRoles, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        address: { type: string, format: email }
        name: { type: string }
        currentRoles: { type: array, uniqueItems: true, items: { type: string, enum: [read, send, manage] } }
        members: { type: array, items: { type: object, required: [email, roles], properties: { email: { type: string, format: email }, roles: { type: array, uniqueItems: true, items: { type: string, enum: [read, send, manage] } } } } }
        createdAt: { $ref: '#/components/schemas/DateTime' }
        updatedAt: { $ref: '#/components/schemas/DateTime' }
    # ── Kiểu cơ bản ──
    Id: { type: string, pattern: '^[a-f0-9]{24}$', example: 6712f0c2a1b2c3d4e5f60718 }
    Date: { type: string, format: date, example: '2026-10-19' }
    DateTime: { type: string, format: date-time, example: '2026-10-19T21:46:00+07:00' }
    Month: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$', example: 2026-10 }

    # ── Giá trị cố định (hợp đồng mục 2) ──
    DocumentType: { type: string, enum: [QD, QT, HD, BM, EXT] }
    DocumentLevel: { type: string, enum: [VCPV, DEPT] }
    DocumentStatus: { type: string, enum: [registered, coded, drafting, feedback, submitted, approved, effective, revising, withdrawn] }
    RevisionKind: { type: string, enum: [minor, major] }
    RecordKind: { type: string, enum: [KH, BC, DX, TD, GV, BB, TB, OPS] }
    RecordStatus: { type: string, enum: [drafting, submitted, finalized, held, disposal_proposed, disposed] }
    ApprovalObjectType: { type: string, enum: [document, document_withdrawal, record, code, retention, external_share, disposal, delegation] }
    ApprovalStatus: { type: string, enum: [pending, approved, changes_requested, cancelled, expired, invalidated] }
    SystemRole: { type: string, enum: [R1, R2, R3, R4, R5, R6, R7, R8, R9] }
    DriveRole: { type: string, enum: [organizer, fileOrganizer, writer, commenter, reader] }
    SecurityLevel: { type: string, enum: [internal, department, confidential] }
    FolderKind: { type: string, enum: [docs, plan_report, operations, area, project, closed, archive, year, month, entity] }
    FolderStatus: { type: string, enum: [active, closed, archived] }
    ShareRole: { type: string, enum: [reader, commenter] }
    ShareStatus: { type: string, enum: [pending_approval, active, expired, revoked] }
    JobStatus: { type: string, enum: [queued, running, done, failed] }
    NotificationChannel: { type: string, enum: [email, zalo, inapp] }
    UserStatus: { type: string, enum: [active, leaving, left], x-gia-dinh: 'Hợp đồng không liệt kê giá trị' }
    CodeType: { type: string, enum: [department, function, channel, project, division], x-gia-dinh: 'Hợp đồng không liệt kê loại mã' }
    CodeStatus: { type: string, enum: [pending, approved, rejected, retired], x-gia-dinh: 'Hợp đồng chỉ nói pending' }
    HoldReasonType: { type: string, enum: [dispute, inspection, warranty, receivable, contract_open, board_request], description: 'Tranh chấp · Thanh tra, kiểm toán · Bảo hành · Công nợ · Hợp đồng chưa thanh lý · Ban Điều hành yêu cầu (BR-22, D5)' }
    ErrorCode: { type: string, enum: [VALIDATION, UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, DUPLICATE, STATE_INVALID, RULE_VIOLATION, LOCKED, PAYLOAD_TOO_LARGE, RATE_LIMITED, DRIVE_ERROR, STORAGE_CONFLICT, UNSUPPORTED_MEDIA_TYPE, STORAGE_INTEGRITY_MISMATCH, STORAGE_UNAVAILABLE, STORAGE_TIMEOUT, MAINTENANCE, INTERNAL] }

    # ── Khung chung ──
    Base:
      type: object
      required: [id, companyId, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        companyId: { $ref: '#/components/schemas/Id' }
        createdAt: { $ref: '#/components/schemas/DateTime' }
        createdBy: { $ref: '#/components/schemas/Id' }
        updatedAt: { $ref: '#/components/schemas/DateTime' }
        updatedBy: { $ref: '#/components/schemas/Id' }

    # ── Drive cơ bản VCworkspace ──
    WorkspaceSpaceKind: { type: string, enum: [department, personal] }
    WorkspaceSpaceRole: { type: string, enum: [manager, reader] }
    WorkspaceSpace:
      type: object
      required: [id, kind, name, role, rootFolderId, allowedActions]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        kind: { $ref: '#/components/schemas/WorkspaceSpaceKind' }
        name: { type: string, minLength: 1, maxLength: 255 }
        role: { $ref: '#/components/schemas/WorkspaceSpaceRole' }
        rootFolderId: { $ref: '#/components/schemas/Id' }
        allowedActions:
          type: array
          uniqueItems: true
          items: { type: string, enum: [list, create-folder, upload, download] }
    WorkspaceSpaceList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/WorkspaceSpace' } }
    WorkspaceDriveFolderInput:
      type: object
      required: [spaceId, name]
      properties:
        spaceId: { $ref: '#/components/schemas/Id' }
        parentId: { $ref: '#/components/schemas/Id' }
        name: { type: string, minLength: 1, maxLength: 255 }
    WorkspaceDocumentInput:
      type: object
      required: [spaceId, name]
      properties:
        spaceId: { $ref: '#/components/schemas/Id' }
        parentId: { $ref: '#/components/schemas/Id' }
        name: { type: string, minLength: 1, maxLength: 250 }
    WorkspaceSpreadsheetInput:
      type: object
      required: [spaceId, name]
      properties:
        spaceId: { $ref: '#/components/schemas/Id' }
        parentId: { $ref: '#/components/schemas/Id' }
        name: { type: string, minLength: 1, maxLength: 250 }
    WorkspacePresentationInput:
      type: object
      required: [spaceId, name]
      properties:
        spaceId: { $ref: '#/components/schemas/Id' }
        parentId: { $ref: '#/components/schemas/Id' }
        name: { type: string, minLength: 1, maxLength: 250 }
    WorkspaceDriveFolder:
      type: object
      required: [id, spaceId, kind, name, storageKey, createdAt, createdBy, allowedActions]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        spaceId: { $ref: '#/components/schemas/Id' }
        parentId: { $ref: '#/components/schemas/Id' }
        kind: { type: string, const: folder }
        name: { type: string }
        storageKey: { type: string, description: 'Định danh trung lập do StoragePort trả về; không lộ credential hoặc đường dẫn máy chủ' }
        createdAt: { $ref: '#/components/schemas/DateTime' }
        createdBy: { $ref: '#/components/schemas/Id' }
        allowedActions:
          type: array
          uniqueItems: true
          items: { type: string, enum: [list, create-folder, upload, rename, move, trash, restore] }
    WorkspaceDriveFile:
      type: object
      required: [id, spaceId, kind, name, mimeType, size, contentSha256, storageKey, createdAt, createdBy, allowedActions]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        spaceId: { $ref: '#/components/schemas/Id' }
        parentId: { $ref: '#/components/schemas/Id' }
        kind: { type: string, const: file }
        name: { type: string }
        mimeType: { type: string, enum: [text/plain, application/octet-stream, application/vnd.openxmlformats-officedocument.wordprocessingml.document, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet, application/vnd.openxmlformats-officedocument.presentationml.presentation, application/pdf] }
        size: { type: integer, minimum: 0, maximum: 10485760 }
        contentSha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        currentVersionId: { $ref: '#/components/schemas/Id' }
        versionNumber: { type: integer, minimum: 1 }
        trashedAt: { $ref: '#/components/schemas/DateTime' }
        storageKey: { type: string, description: 'Định danh trung lập do StoragePort trả về; không lộ credential hoặc đường dẫn máy chủ' }
        createdAt: { $ref: '#/components/schemas/DateTime' }
        createdBy: { $ref: '#/components/schemas/Id' }
        allowedActions:
          type: array
          uniqueItems: true
          items: { type: string, enum: [download, rename, move, upload-version, list-versions, restore-version, trash, restore] }
    WorkspaceDriveItem:
      oneOf:
        - $ref: '#/components/schemas/WorkspaceDriveFolder'
        - $ref: '#/components/schemas/WorkspaceDriveFile'
    WorkspaceDriveItemList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/WorkspaceDriveItem' } }
        nextCursor: { type: string }
    WorkspaceDriveItemUpdate:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        parentId: { $ref: '#/components/schemas/Id' }
    WorkspaceDriveVersion:
      type: object
      required: [id, fileId, number, mimeType, size, contentSha256, createdAt, createdBy]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        fileId: { $ref: '#/components/schemas/Id' }
        number: { type: integer, minimum: 1 }
        mimeType: { type: string }
        size: { type: integer, minimum: 0, maximum: 10485760 }
        contentSha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        createdAt: { $ref: '#/components/schemas/DateTime' }
        createdBy: { $ref: '#/components/schemas/Id' }
    WorkspaceDriveVersionList:
      type: object
      required: [items]
      properties: { items: { type: array, items: { $ref: '#/components/schemas/WorkspaceDriveVersion' } } }
    WorkspaceTrashResult:
      type: object
      required: [id, trashedAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        trashedAt: { $ref: '#/components/schemas/DateTime' }
    WorkspaceEditorConfig:
      type: object
      required: [documentServerUrl, config, mode]
      properties:
        documentServerUrl: { type: string, format: uri }
        config: { type: object, additionalProperties: true }
        mode: { type: string, enum: [edit, view] }
    WorkspaceEditorCallback:
      type: object
      required: [key, status]
      properties:
        key: { type: string }
        status: { type: integer, enum: [1, 2, 3, 4, 6, 7] }
        url: { type: string, format: uri }
        token: { type: string }
    # allowedActions (D9): tên kebab-case = đoạn cuối đường dẫn; sửa thông tin (PATCH) = update.
    # FE chỉ hiện nút có trong danh sách; BE vẫn kiểm lại khi gọi.
    DocumentActions:
      type: object
      required: [allowedActions]
      properties:
        allowedActions: { type: array, uniqueItems: true, items: { type: string, enum: [assign-code, create-draft, request-feedback, feedback, submit, issue, revise, review, withdraw, relock, integrity, update-external] } }
    ApprovalActions:
      type: object
      required: [allowedActions]
      properties:
        allowedActions: { type: array, uniqueItems: true, items: { type: string, enum: [check, decide, cancel, remind] } }
    CodeActions:
      type: object
      required: [allowedActions]
      properties:
        allowedActions: { type: array, uniqueItems: true, items: { type: string, enum: [decide] } }
    RecordTypeActions:
      type: object
      required: [allowedActions]
      properties:
        allowedActions: { type: array, uniqueItems: true, items: { type: string, enum: [update, submit-retention] } }
    RecordActions:
      type: object
      required: [allowedActions]
      properties:
        allowedActions: { type: array, uniqueItems: true, items: { type: string, enum: [update, submit, finalize, adjust, scan, hold, release-hold, share, integrity] } }
    ExternalShareActions:
      type: object
      required: [allowedActions]
      properties:
        allowedActions: { type: array, uniqueItems: true, items: { type: string, enum: [extend, revoke] } }
    UserActions:
      type: object
      required: [allowedActions]
      properties:
        allowedActions: { type: array, uniqueItems: true, items: { type: string, enum: [update-roles, update-leave] } }
    FolderActions:
      type: object
      required: [allowedActions]
      properties:
        allowedActions: { type: array, uniqueItems: true, items: { type: string, enum: [create-child, rename, close-project, resync] } }
    CatalogActions:
      type: object
      required: [allowedActions]
      properties:
        allowedActions: { type: array, uniqueItems: true, items: { type: string, enum: [update] } }
    PageMeta:
      type: object
      required: [page, limit, total, people]
      properties:
        page: { type: integer, minimum: 1 }
        limit: { type: integer, minimum: 1, maximum: 200 }
        total: { type: integer, minimum: 0 }
        people: { $ref: '#/components/schemas/People' }
    People:
      type: object
      description: 'id người → UserRef, cho mọi id người xuất hiện trong phản hồi (D10)'
      additionalProperties: { $ref: '#/components/schemas/UserRef' }
    DocumentDetail:
      description: 'Document kèm people (chi tiết một đối tượng, D17)'
      allOf:
        - $ref: '#/components/schemas/Document'
        - $ref: '#/components/schemas/WithPeople'
    RecordDetail:
      description: 'Record kèm people (chi tiết một đối tượng, D17)'
      allOf:
        - $ref: '#/components/schemas/Record'
        - $ref: '#/components/schemas/WithPeople'
    ApprovalDetail:
      description: 'Approval kèm people (chi tiết một đối tượng, D17)'
      allOf:
        - $ref: '#/components/schemas/Approval'
        - $ref: '#/components/schemas/WithPeople'
    CodeDetail:
      description: 'Code kèm people (chi tiết một đối tượng, D17)'
      allOf:
        - $ref: '#/components/schemas/Code'
        - $ref: '#/components/schemas/WithPeople'
    RecordTypeDetail:
      description: 'RecordType kèm people (chi tiết một đối tượng, D17)'
      allOf:
        - $ref: '#/components/schemas/RecordType'
        - $ref: '#/components/schemas/WithPeople'
    ExternalShareDetail:
      description: 'ExternalShare kèm people (chi tiết một đối tượng, D17)'
      allOf:
        - $ref: '#/components/schemas/ExternalShare'
        - $ref: '#/components/schemas/WithPeople'
    DelegationDetail:
      description: 'Delegation kèm people (chi tiết một đối tượng, D17)'
      allOf:
        - $ref: '#/components/schemas/Delegation'
        - $ref: '#/components/schemas/WithPeople'
    JobDetail:
      description: 'Job kèm people (chi tiết một đối tượng, D17)'
      allOf:
        - $ref: '#/components/schemas/Job'
        - $ref: '#/components/schemas/WithPeople'
    WithPeople:
      type: object
      required: [people]
      properties:
        people: { $ref: '#/components/schemas/People' }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: { $ref: '#/components/schemas/ErrorCode' }
            message: { type: string, description: 'Tiếng Việt cho người dùng' }
            rule: { type: string, description: 'Mã BR khi code = RULE_VIOLATION', example: BR-02 }
            details:
              type: array
              items: { type: object, required: [field, issue], properties: { field: { type: string }, issue: { type: string } } }
            requestId: { type: string }
      example:
        error: { code: RULE_VIOLATION, message: Quy định chỉ được đăng ký ở cấp VCPV, rule: BR-02, details: [{ field: level, issue: must_be_VCPV }], requestId: 3f1c9a }
    Lock:
      type: object
      required: [isLocked]
      properties:
        isLocked: { type: boolean }
        lockedAt: { $ref: '#/components/schemas/DateTime' }
        unlockedUntil: { $ref: '#/components/schemas/DateTime' }
        unlockReason: { type: string }
    UserRef:
      type: object
      required: [id, name, email]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        email: { type: string, format: email }
        title: { type: string }
        departmentId: { $ref: '#/components/schemas/Id' }

    # ── M01 ──
    IdentityLifecycleInput:
      type: object
      required: [subject, email, groups, active]
      properties:
        subject: { type: string, minLength: 1, maxLength: 300 }
        email: { type: string, format: email }
        groups: { type: array, uniqueItems: true, maxItems: 100, items: { type: string, minLength: 1, maxLength: 200 } }
        active: { type: boolean }
        globalRevoke: { type: boolean, default: false }
    IdentityLifecycleStep:
      type: object
      required: [name, status, attempts]
      properties:
        name: { type: string, enum: [app-deny, authentik, nextcloud, app-commit] }
        status: { type: string, enum: [pending, running, failed, done] }
        attempts: { type: integer, minimum: 0 }
        lastError: { type: string }
        completedAt: { $ref: '#/components/schemas/DateTime' }
    IdentityLifecycleOperation:
      type: object
      required: [id, subject, subjectRevision, desired, status, steps, version, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        subject: { type: string }
        subjectRevision: { type: integer, minimum: 1 }
        desired: { $ref: '#/components/schemas/IdentityLifecycleInput' }
        status: { type: string, enum: [pending, running, partial, superseded, done] }
        steps: { type: array, items: { $ref: '#/components/schemas/IdentityLifecycleStep' } }
        version: { type: integer, minimum: 0 }
        lastError: { type: string }
        completedAt: { $ref: '#/components/schemas/DateTime' }
        createdAt: { $ref: '#/components/schemas/DateTime' }
        updatedAt: { $ref: '#/components/schemas/DateTime' }
    Me:
      type: object
      required: [user, systemRoles, drives, csrfToken, limits]
      properties:
        user: { $ref: '#/components/schemas/User' }
        systemRoles: { type: array, items: { $ref: '#/components/schemas/SystemRole' } }
        departmentId: { $ref: '#/components/schemas/Id' }
        drives:
          type: array
          items:
            type: object
            required: [driveId, name, role, securityLevel]
            properties:
              driveId: { type: string }
              departmentId: { $ref: '#/components/schemas/Id' }
              name: { type: string, example: 11 MKT }
              role: { $ref: '#/components/schemas/DriveRole' }
              securityLevel: { $ref: '#/components/schemas/SecurityLevel' }
        blockId: { $ref: '#/components/schemas/Id', description: 'Khối tôi làm giám đốc (D12)' }
        limits:
          type: object
          description: 'Con số cấu hình để FE báo trước; BE vẫn là nơi quyết định (D12)'
          required: [shareMaxDays, backdateWorkingDays, approvalDueDays, minorUnlockDays, uploadMaxMb]
          properties:
            shareMaxDays: { type: integer, example: 30 }
            backdateWorkingDays: { type: integer, example: 3 }
            approvalDueDays: { type: integer, example: 3 }
            minorUnlockDays: { type: integer, example: 3 }
            uploadMaxMb: { type: integer, example: 100 }
        csrfToken: { type: string }
        sessionExpiresAt: { $ref: '#/components/schemas/DateTime' }
    User:
      allOf:
        - $ref: '#/components/schemas/Base'
        - $ref: '#/components/schemas/UserActions'
        - type: object
          required: [email, name, status, systemRoles]
          properties:
            email: { type: string, format: email }
            name: { type: string }
            title: { type: string, description: 'Chức danh' }
            departmentId: { $ref: '#/components/schemas/Id' }
            status: { $ref: '#/components/schemas/UserStatus' }
            systemRoles: { type: array, items: { $ref: '#/components/schemas/SystemRole' } }
            lastWorkingDay: { $ref: '#/components/schemas/Date' }
    UserPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/User' } } } }
    Drive:
      type: object
      required: [driveId, name, securityLevel]
      properties:
        driveId: { type: string }
        departmentId: { $ref: '#/components/schemas/Id' }
        name: { type: string, example: 11 MKT }
        securityLevel: { $ref: '#/components/schemas/SecurityLevel' }
        myRole: { $ref: '#/components/schemas/DriveRole', description: 'Trống khi tôi không là thành viên' }
    DriveMember:
      type: object
      required: [email, role, type]
      properties:
        permissionId: { type: string }
        email: { type: string }
        name: { type: string }
        type: { type: string, enum: [user, group, domain, anyone] }
        role: { $ref: '#/components/schemas/DriveRole' }
        viaGroup: { type: string, description: 'Email nhóm Google cấp quyền; trống = thành viên lẻ' }
        anomaly: { type: string, enum: [direct_member, foreign_member] }

    # ── M02 ──
    Block:
      allOf:
        - $ref: '#/components/schemas/Base'
        - $ref: '#/components/schemas/CatalogActions'
        - $ref: '#/components/schemas/BlockInput'
    BlockInput:
      type: object
      required: [code, name]
      properties:
        code: { type: string, example: KD }
        name: { type: string, example: Khối Kinh doanh }
        directorId: { $ref: '#/components/schemas/Id' }
    Department:
      allOf:
        - $ref: '#/components/schemas/Base'
        - $ref: '#/components/schemas/CatalogActions'
        - $ref: '#/components/schemas/DepartmentInput'
    DepartmentInput:
      type: object
      required: [code, number, name, driveId, securityLevel]
      properties:
        code: { type: string, example: MKT }
        number: { type: string, example: '11' }
        name: { type: string, example: Marketing }
        blockId: { $ref: '#/components/schemas/Id' }
        driveId: { type: string }
        securityLevel: { $ref: '#/components/schemas/SecurityLevel' }
        headId: { $ref: '#/components/schemas/Id' }
        groupEmails: { type: array, items: { type: string }, description: 'Nhóm Google gắn với drive' }
    Division:
      allOf:
        - $ref: '#/components/schemas/Base'
        - $ref: '#/components/schemas/CatalogActions'
        - $ref: '#/components/schemas/DivisionInput'
    DivisionInput:
      type: object
      required: [prefix, name]
      properties:
        prefix: { type: string, example: VCS }
        name: { type: string }
    Code:
      allOf:
        - $ref: '#/components/schemas/Base'
        - $ref: '#/components/schemas/CodeActions'
        - type: object
          required: [code, type, meaning, status]
          properties:
            code: { type: string }
            type: { $ref: '#/components/schemas/CodeType' }
            meaning: { type: string }
            scope: { type: string }
            reason: { type: string }
            departmentId: { $ref: '#/components/schemas/Id' }
            status: { $ref: '#/components/schemas/CodeStatus' }
            decision: { $ref: '#/components/schemas/Decision' }
    CodePage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Code' } } } }
    DecideInput:
      type: object
      required: [result]
      properties:
        result: { type: string, enum: [approve, reject] }
        comment: { type: string }

    # ── M03 ──
    Folder:
      allOf:
        - $ref: '#/components/schemas/Base'
        - $ref: '#/components/schemas/FolderActions'
        - type: object
          required: [driveId, googleId, number, shortName, fullName, kind, path, securityLevel, status, isManagedByVcdocs]
          properties:
            driveId: { type: string }
            googleId: { type: string }
            parentId: { $ref: '#/components/schemas/Id' }
            number: { type: string, example: '01' }
            code: { type: string, example: SEO-PTDA }
            shortName: { type: string }
            fullName: { type: string }
            kind: { $ref: '#/components/schemas/FolderKind' }
            path: { type: string, example: 11 MKT / 10 SEO / 01 SEO-PTDA }
            year: { type: integer }
            month: { type: integer, minimum: 1, maximum: 12 }
            securityLevel: { $ref: '#/components/schemas/SecurityLevel' }
            status: { $ref: '#/components/schemas/FolderStatus' }
            isManagedByVcdocs: { type: boolean }
            hasChildren: { type: boolean }

    # ── M04 ──
    DocumentCurrent:
      type: object
      properties:
        number: { type: integer, minimum: 1 }
        fileId: { type: string }
        revisionId: { type: string }
        pdfFileId: { type: string }
        pdfSha256: { type: string }
        effectiveFrom: { $ref: '#/components/schemas/Date' }
        issuedBy: { $ref: '#/components/schemas/Id' }
        approvalId: { $ref: '#/components/schemas/Id' }
    DocumentVersion:
      type: object
      required: [number, kind]
      properties:
        number: { type: integer, minimum: 1 }
        kind: { $ref: '#/components/schemas/RevisionKind' }
        changeNote: { type: string }
        approvedBy: { $ref: '#/components/schemas/Id' }
        effectiveFrom: { $ref: '#/components/schemas/Date' }
        revisionId: { type: string }
        pdfSha256: { type: string }
    DocumentSummary:
      allOf:
        - $ref: '#/components/schemas/Base'
        - $ref: '#/components/schemas/DocumentActions'
        - type: object
          required: [type, level, title, departmentId, status]
          properties:
            code: { type: string, example: QT-MKT-01 }
            type: { $ref: '#/components/schemas/DocumentType' }
            level: { $ref: '#/components/schemas/DocumentLevel' }
            title: { type: string }
            departmentId: { $ref: '#/components/schemas/Id' }
            status: { $ref: '#/components/schemas/DocumentStatus' }
            securityLevel: { $ref: '#/components/schemas/SecurityLevel' }
            drafterId: { $ref: '#/components/schemas/Id' }
            checkerId: { $ref: '#/components/schemas/Id' }
            approverId: { $ref: '#/components/schemas/Id' }
            dueDate: { $ref: '#/components/schemas/Date' }
            reviewDue: { $ref: '#/components/schemas/Date' }
            current: { $ref: '#/components/schemas/DocumentCurrent' }
            isRestricted: { type: boolean, description: 'true = tài liệu Mật, người gọi chỉ thấy mã và tên' }
    Document:
      allOf:
        - $ref: '#/components/schemas/DocumentSummary'
        - type: object
          properties:
            versions: { type: array, items: { $ref: '#/components/schemas/DocumentVersion' } }
            lock: { $ref: '#/components/schemas/Lock' }
            replacesId: { $ref: '#/components/schemas/Id' }
            replacedById: { $ref: '#/components/schemas/Id' }
            folderId: { $ref: '#/components/schemas/Id' }
            fileId: { type: string }
            external:
              type: object
              properties:
                source: { type: string }
                number: { type: string }
                issuedAt: { $ref: '#/components/schemas/Date' }
                lastCheckedAt: { $ref: '#/components/schemas/DateTime' }
                isSuperseded: { type: boolean }
                originalUrl: { type: string }
            relatedIds: { type: array, items: { $ref: '#/components/schemas/Id' } }
    DocumentPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/DocumentSummary' } } } }
    Integrity:
      type: object
      required: [isLocked, isRevisionMatching, checkedAt]
      properties:
        isLocked: { type: boolean }
        isRevisionMatching: { type: boolean, description: 'revisionId hiện tại trên Drive khớp bản hiệu lực/chốt' }
        isHashMatching: { type: boolean, description: 'Mã băm PDF khớp' }
        currentRevisionId: { type: string }
        expectedRevisionId: { type: string }
        checkedAt: { $ref: '#/components/schemas/DateTime' }

    # ── M05 ──
    Decision:
      type: object
      required: [by, at, result]
      properties:
        by: { $ref: '#/components/schemas/Id' }
        at: { $ref: '#/components/schemas/DateTime' }
        result: { type: string, enum: [approve, changes_requested, reject] }
        comment: { type: string }
        device: { type: string }
        ip: { type: string }
    Approval:
      allOf:
        - $ref: '#/components/schemas/Base'
        - $ref: '#/components/schemas/ApprovalActions'
        - type: object
          required: [objectType, objectId, submittedBy, submittedAt, approverId, status]
          properties:
            objectType: { $ref: '#/components/schemas/ApprovalObjectType' }
            objectId: { $ref: '#/components/schemas/Id' }
            objectTitle: { type: string, description: 'Tên hiển thị của đối tượng trình' }
            snapshot:
              type: object
              properties:
                revisionId: { type: string }
                pdfFileId: { type: string }
                pdfSha256: { type: string }
                takenAt: { $ref: '#/components/schemas/DateTime' }
                viewUrl: { type: string, description: 'Link xem đúng bản chụp' }
            submittedBy: { $ref: '#/components/schemas/Id' }
            submittedAt: { $ref: '#/components/schemas/DateTime' }
            approverId: { $ref: '#/components/schemas/Id' }
            approverRule: { type: string }
            checkerId: { $ref: '#/components/schemas/Id' }
            checkedAt: { $ref: '#/components/schemas/DateTime' }
            status: { $ref: '#/components/schemas/ApprovalStatus' }
            decision: { $ref: '#/components/schemas/Decision' }
            dueAt: { $ref: '#/components/schemas/DateTime' }
            reminders: { type: array, items: { $ref: '#/components/schemas/DateTime' } }
            invalidatedReason: { type: string }
            jobId: { $ref: '#/components/schemas/Id', description: 'Việc nền chạy sau quyết định, vd document.withdraw (D15)' }
    ApprovalPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Approval' } } } }
    Delegation:
      allOf:
        - $ref: '#/components/schemas/Base'
        - $ref: '#/components/schemas/CatalogActions'
        - $ref: '#/components/schemas/DelegationInput'
    DelegationInput:
      type: object
      required: [blockId, recordTypeId, delegateId, from]
      properties:
        blockId: { $ref: '#/components/schemas/Id' }
        recordTypeId: { $ref: '#/components/schemas/Id', description: 'Loại hồ sơ được uỷ quyền duyệt (D6)' }
        task: { type: string, description: 'Mô tả việc' }
        isLegalSignature: { type: boolean, default: false, description: 'Việc luật yêu cầu chữ ký người đại diện → không được uỷ quyền (422 BR-24)' }
        limitAmount: { type: number, minimum: 0, description: 'Hạn mức (VND)' }
        delegateId: { $ref: '#/components/schemas/Id' }
        from: { $ref: '#/components/schemas/Date' }
        to: { $ref: '#/components/schemas/Date' }

    # ── M06 ──
    RecordTypeInput:
      type: object
      required: [departmentId, name, kind, namingRule, folderId, keeperTitle, retentionYears, retentionBasis, disposalMethod, securityLevel]
      properties:
        departmentId: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        kind: { $ref: '#/components/schemas/RecordKind' }
        namingRule: { type: string }
        example: { type: string }
        folderId: { $ref: '#/components/schemas/Id' }
        keeperTitle: { type: string, description: 'Chức danh người giữ' }
        retentionYears: { type: integer, minimum: 0, description: '0 = vĩnh viễn', x-gia-dinh: Hợp đồng không nói cách ghi vĩnh viễn }
        retentionBasis: { type: string, description: 'Căn cứ pháp lý/nội bộ' }
        disposalMethod: { type: string }
        securityLevel: { $ref: '#/components/schemas/SecurityLevel' }
        templateId: { type: string, description: 'fileId biểu mẫu' }
        requiresApproval: { type: boolean, x-gia-dinh: 'Hợp đồng mục 5.2 nói "loại hồ sơ cần duyệt" nhưng không có trường' }
    RecordTypePatch:
      type: object
      properties:
        name: { type: string }
        namingRule: { type: string }
        example: { type: string }
        folderId: { $ref: '#/components/schemas/Id' }
        keeperTitle: { type: string }
        retentionYears: { type: integer, minimum: 0 }
        retentionBasis: { type: string }
        disposalMethod: { type: string }
        securityLevel: { $ref: '#/components/schemas/SecurityLevel' }
        templateId: { type: string }
        requiresApproval: { type: boolean }
    RecordType:
      allOf:
        - $ref: '#/components/schemas/Base'
        - $ref: '#/components/schemas/RecordTypeActions'
        - $ref: '#/components/schemas/RecordTypeInput'
        - type: object
          required: [retentionStatus]
          properties:
            retentionStatus: { type: string, enum: [draft, submitted, approved], description: 'approved mới lập được hồ sơ (BR-20)' }
            retentionApprovalId: { $ref: '#/components/schemas/Id' }

    # ── M07 ──
    RecordInput:
      type: object
      required: [recordTypeId, kind, functionCode, subject, workMonth]
      properties:
        recordTypeId: { $ref: '#/components/schemas/Id' }
        kind: { $ref: '#/components/schemas/RecordKind' }
        functionCode: { type: string, example: SEO-PTDA }
        subject: { type: string }
        identifier: { type: string, description: 'Bắt buộc khi kind = OPS' }
        workMonth: { $ref: '#/components/schemas/Month' }
        createdDate: { $ref: '#/components/schemas/Date' }
        backdateReason: { type: string, description: 'Bắt buộc khi createdDate sớm quá hạn (BR-28)' }
    RecordSummary:
      allOf:
        - $ref: '#/components/schemas/Base'
        - $ref: '#/components/schemas/RecordActions'
        - type: object
          required: [number, functionCode, kind, subject, recordTypeId, workMonth, status]
          properties:
            number: { type: string, example: HS-2026-000123 }
            functionCode: { type: string }
            kind: { $ref: '#/components/schemas/RecordKind' }
            subject: { type: string }
            identifier: { type: string }
            recordTypeId: { $ref: '#/components/schemas/Id' }
            departmentId: { $ref: '#/components/schemas/Id' }
            workMonth: { $ref: '#/components/schemas/Month' }
            createdDate: { $ref: '#/components/schemas/Date' }
            fileName: { type: string }
            folderId: { $ref: '#/components/schemas/Id' }
            fileId: { type: string }
            mimeType: { type: string }
            status: { $ref: '#/components/schemas/RecordStatus' }
            isApproved: { type: boolean, description: 'Đã được duyệt, chờ người lập chốt (mục 5.2)' }
            isClaimed: { type: boolean }
    Record:
      allOf:
        - $ref: '#/components/schemas/RecordSummary'
        - type: object
          properties:
            approvalId: { $ref: '#/components/schemas/Id' }
            finalized:
              type: object
              properties:
                at: { $ref: '#/components/schemas/DateTime' }
                by: { $ref: '#/components/schemas/Id' }
                revisionId: { type: string }
                pdfFileId: { type: string }
                pdfSha256: { type: string }
                vaultKey: { type: string }
                verifyCode: { type: string }
            lock: { $ref: '#/components/schemas/Lock' }
            paperLocation: { type: string }
            hold:
              type: object
              properties:
                isActive: { type: boolean }
                reasonType: { $ref: '#/components/schemas/HoldReasonType' }
                reason: { type: string }
                by: { $ref: '#/components/schemas/Id' }
                at: { $ref: '#/components/schemas/DateTime' }
            retention:
              type: object
              properties:
                years: { type: integer }
                basis: { type: string }
                until: { $ref: '#/components/schemas/Date' }
            adjustsId: { $ref: '#/components/schemas/Id' }
            adjustedByIds: { type: array, items: { $ref: '#/components/schemas/Id' } }
            backdateReason: { type: string }
    RecordPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/RecordSummary' } } } }
    DriveFile:
      type: object
      required: [fileId, name, mimeType]
      properties:
        fileId: { type: string }
        name: { type: string }
        mimeType: { type: string }
        driveId: { type: string }
        parentGoogleId: { type: string }
        createdTime: { $ref: '#/components/schemas/DateTime' }
        ownerEmail: { type: string }
        webViewLink: { type: string }

    # ── M08 ──
    SearchHit:
      type: object
      required: [objectType, id, title]
      properties:
        objectType: { type: string, enum: [document, record] }
        id: { $ref: '#/components/schemas/Id' }
        code: { type: string, description: 'Mã tài liệu hoặc số hồ sơ' }
        title: { type: string }
        status: { type: string }
        departmentId: { $ref: '#/components/schemas/Id' }
        workMonth: { $ref: '#/components/schemas/Month' }
        identifier: { type: string }
    SearchPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/SearchHit' } } } }

    # ── M09 ──
    ExternalShare:
      allOf:
        - $ref: '#/components/schemas/Base'
        - $ref: '#/components/schemas/ExternalShareActions'
        - type: object
          required: [fileId, email, role, status, source]
          description: 'reason, expiresAt bắt buộc khi source = vcdocs; trống được khi source = detected (D7)'
          properties:
            fileId: { type: string }
            fileName: { type: string }
            recordId: { $ref: '#/components/schemas/Id' }
            documentId: { $ref: '#/components/schemas/Id' }
            departmentId: { $ref: '#/components/schemas/Id' }
            email: { type: string, format: email }
            role: { $ref: '#/components/schemas/ShareRole' }
            reason: { type: string }
            expiresAt: { $ref: '#/components/schemas/DateTime' }
            sharedBy: { $ref: '#/components/schemas/Id' }
            approvalId: { $ref: '#/components/schemas/Id' }
            permissionId: { type: string }
            status: { $ref: '#/components/schemas/ShareStatus' }
            revokedAt: { $ref: '#/components/schemas/DateTime' }
            revokedBy: { $ref: '#/components/schemas/Id' }
            source: { type: string, enum: [vcdocs, detected] }
            detectedAt: { $ref: '#/components/schemas/DateTime' }
    ExternalSharePage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/ExternalShare' } } } }

    # ── M14 ──
    Notification:
      type: object
      required: [id, type, title, createdAt, isRead]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        type: { type: string, description: 'Ví dụ approval_pending, approval_decided, document_issued, share_expiring, job_done, job_failed' }
        title: { type: string }
        body: { type: string }
        link: { type: string, description: 'Đường dẫn trong giao diện' }
        objectType: { type: string }
        objectId: { $ref: '#/components/schemas/Id' }
        createdAt: { $ref: '#/components/schemas/DateTime' }
        isRead: { type: boolean }
    NotificationPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [items, unreadCount]
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/Notification' } }
            unreadCount: { type: integer, minimum: 0 }
    NotificationSettings:
      type: object
      required: [channels, digest]
      properties:
        channels: { type: array, items: { $ref: '#/components/schemas/NotificationChannel' } }
        digest: { type: string, enum: [instant, daily], x-gia-dinh: 'Hợp đồng không liệt kê giá trị digest' }

    # ── Việc nền ──
    Job:
      allOf:
        - $ref: '#/components/schemas/Base'
        - type: object
          required: [type, status, progress, steps, requestedBy]
          properties:
            type: { type: string, enum: [document.withdraw, google.sync, codes.export, folder.create, folder.close_project, folder.ensure_periods, document.create_draft, document.issue, documents.catalog_export, external_document.import, record_types.catalog_export, record.create, record.upload, record.claim, record.finalize, record.scan, share.revoke_all] }
            status: { $ref: '#/components/schemas/JobStatus' }
            progress: { type: integer, minimum: 0, maximum: 100 }
            steps:
              type: array
              items:
                type: object
                required: [name, status]
                properties:
                  name: { type: string }
                  status: { $ref: '#/components/schemas/JobStatus' }
                  error: { type: string }
            result:
              description: 'Không có với google.sync, folder.ensure_periods, share.revoke_all (D16). Kết quả cuối (D11): { objectType, objectId } khi tạo/đổi đối tượng; { fileId } khi xuất file'
              oneOf:
                - type: object
                  required: [objectType, objectId]
                  properties:
                    objectType: { type: string, enum: [document, record, folder, approval, external_share, code, record_type] }
                    objectId: { $ref: '#/components/schemas/Id' }
                - type: object
                  required: [fileId]
                  properties:
                    fileId: { type: string }
                    url: { type: string }
            summary: { type: object, additionalProperties: true, description: 'Số liệu tóm tắt, vd { created: 12 } (D16)' }
            error: { $ref: '#/components/schemas/Error' }
            startedAt: { $ref: '#/components/schemas/DateTime' }
            finishedAt: { $ref: '#/components/schemas/DateTime' }
            requestedBy: { $ref: '#/components/schemas/Id' }
    FlowNextcloudWebhook:
      type: object
      description: Payload webhook_listeners nguyên bản (giữ trường lạ để băm và đối chiếu replay); máy chủ chỉ dùng class, id số nguyên, time, user.uid
      required: [event, time]
      additionalProperties: true
      properties:
        event:
          type: object
          required: [class]
          additionalProperties: true
          properties:
            class: { type: string, maxLength: 200 }
        user:
          type: [object, 'null']
          properties:
            uid: { type: string, maxLength: 64 }
            displayName: { type: string }
        time: { type: integer, minimum: 1, description: 'Giây Unix do Nextcloud đặt lúc phát event' }
        authentication: { description: 'Token tạm của webhook_listeners; máy chủ bỏ qua, không lưu' }
    FlowWebhookAccepted:
      type: object
      required: [journalId, duplicate, status]
      properties:
        journalId: { $ref: '#/components/schemas/Id' }
        duplicate: { type: boolean, description: 'true khi (lớp event, tài nguyên, time) đã có trong journal' }
        status: { $ref: '#/components/schemas/FlowEventStatus' }
    FlowEventStatus: { type: string, enum: [queued, running, done, skipped, failed] }
    FlowEvent:
      type: object
      required: [id, source, eventClass, resourceKey, ruleIds, status, attempts, replayCount, correlationId, eventTime, receivedAt, deliveryLagMs, results]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        source: { type: string, enum: [webhook, reconcile] }
        eventClass: { type: string }
        resourceKey: { type: string, description: 'Ví dụ forms:submission:5:10, tables:row:5:29, files:node:643' }
        ruleIds: { type: array, items: { type: string } }
        status: { $ref: '#/components/schemas/FlowEventStatus' }
        attempts: { type: integer, minimum: 0 }
        replayCount: { type: integer, minimum: 0 }
        claimedActorUid: { type: [string, 'null'], description: 'uid theo payload; chỉ ghi nhận, không dùng cấp quyền' }
        correlationId: { type: string, description: 'requestId gắn vào mọi dòng audit_logs của event này' }
        eventTime: { $ref: '#/components/schemas/DateTime' }
        receivedAt: { $ref: '#/components/schemas/DateTime' }
        finishedAt: { oneOf: [{ $ref: '#/components/schemas/DateTime' }, { type: 'null' }] }
        deliveryLagMs: { type: integer, minimum: 0, description: 'receivedAt − eventTime (eventTime chỉ chính xác tới giây)' }
        processingMs: { type: [integer, 'null'], minimum: 0 }
        results:
          type: array
          items:
            type: object
            required: [outcome]
            additionalProperties: true
            properties:
              ruleId: { type: [string, 'null'] }
              outcome: { type: string, description: 'card_created, card_recovered, already_done, notified, no_recipient, tag_verified, no_rule, runner_forbidden, not_found, board_wider_than_results, …' }
              message: { type: string }
        lastError: { type: [string, 'null'] }
    FlowEventPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/FlowEvent' } } } }
    JobPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Job' } } } }

name: VCworkspace verification
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: VCworkspace / verify
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Enforce dev to main
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: test "$HEAD_REF" = dev && test "$HEAD_REPO" = "$THIS_REPO"
      - uses: pnpm/action-setup@v4
        with:
          version: 9.2.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install isolated MongoDB test binary
        run: |
          curl --fail --silent --show-error --location https://fastdl.mongodb.org/linux/mongodb-linux-x86_64-ubuntu2204-7.0.14.tgz -o "$RUNNER_TEMP/mongodb.tgz"
          mkdir "$RUNNER_TEMP/mongodb"
          tar -xzf "$RUNNER_TEMP/mongodb.tgz" --strip-components=1 -C "$RUNNER_TEMP/mongodb"
          echo "MONGOMS_SYSTEM_BINARY=$RUNNER_TEMP/mongodb/bin/mongod" >> "$GITHUB_ENV"
      - name: Full contract, type, test and build gate
        run: pnpm ai:check:full
        env:
          GOOGLE_MODE: fake
          NEXT_TELEMETRY_DISABLED: '1'

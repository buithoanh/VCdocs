# Chat15 simulated NAS (Samba standalone). Group-based share ACL:
#   team-a: only members of the Unix group nas-team-a (svc-nc-team-a, nas-member-a)
#   team-b: only members of nas-team-b (svc-nc-team-b, nas-manager-b)
# No guest, no anonymous listing, SMB2+ only, no NetBIOS, no printers.
[global]
   server role = standalone server
   workgroup = VCW15
   security = user
   map to guest = Never
   restrict anonymous = 2
   server min protocol = SMB2_10
   smb ports = 445
   disable netbios = yes
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   unix charset = UTF-8
   kernel change notify = yes
   change notify = yes
   log level = 1
   logging = file
   log file = /var/log/samba/%m.log
   max log size = 1000
   passdb backend = tdbsam

[team-a]
   path = /srv/nas/team-a
   valid users = @nas-team-a
   read only = no
   browseable = no
   force group = nas-team-a
   create mask = 0660
   directory mask = 2770

[team-b]
   path = /srv/nas/team-b
   valid users = @nas-team-b
   read only = no
   browseable = no
   force group = nas-team-b
   create mask = 0660
   directory mask = 2770

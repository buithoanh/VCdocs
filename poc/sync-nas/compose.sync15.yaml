name: vcworkspace-sync15
# Chat15 Sync + NAS overlay on the running chat13 stack (project vcworkspace-work13).
# - nas15: simulated NAS (Samba 4.21 on pinned Alpine), only on the internal
#   work13 network (no host port), own new volume vcworkspace_sync15_nas.
# - smb-client: SMB client container for "edit directly on the NAS" and the
#   direct-SMB deny matrix; same image, auth files mounted read-only.
# - files-notify: `occ files_external:notify` for the Team A mount (Team B has
#   no notify on purpose, to compare with scan/check-on-access).
# The work13 `nextcloud` service itself runs the derived image with SMB support
# through compose.work13-nc-smb.override.yaml (see README).
services:
  nas15:
    image: vcworkspace-sync15/nas:alpine3.22.2-1
    build: ./nas
    restart: unless-stopped
    hostname: nas15
    volumes:
      - nas:/srv/nas
      - ./secrets/nas:/run/nas-secrets:ro
    networks:
      work13:
        aliases: [nas15]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, FSETID, SETUID, SETGID, NET_BIND_SERVICE, KILL]
    cpus: 1.0
    mem_limit: 512m

  smb-client:
    image: vcworkspace-sync15/nas:alpine3.22.2-1
    restart: "no"
    entrypoint: ["sleep", "infinity"]
    volumes:
      - ./secrets/smbauth:/auth:ro
      - smbwork:/work
    networks: [work13]
    cap_drop: [ALL]
    cpus: 1.0
    mem_limit: 512m

  files-notify:
    image: vcworkspace-sync15/nextcloud-smb:33.0.10-1
    platform: linux/arm64
    restart: unless-stopped
    user: www-data
    # Not apache2-foreground/php-fpm, so the image entrypoint skips install/upgrade.
    entrypoint: ["php", "/var/www/html/occ", "--no-ansi", "files_external:notify", "-v", "${SYNC15_NOTIFY_MOUNT_ID:-1}"]
    volumes: [work13_nextcloud:/var/www/html]
    networks: [work13]
    cpus: 0.5
    mem_limit: 512m

networks:
  work13:
    external: true
    name: vcworkspace-work13_work13

volumes:
  nas: {name: vcworkspace_sync15_nas}
  smbwork: {name: vcworkspace_sync15_smbwork}
  work13_nextcloud:
    external: true
    name: vcworkspace_work13_nextcloud

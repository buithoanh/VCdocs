name: vcworkspace-mail07-restore
# Chat07 khôi phục độc lập: volume riêng (vcworkspace_mail07_restore_*), mạng internal: true cho Stalwart
# (không ra Internet, không publish cổng). Chỉ relay nc mỏng nối cổng IMAPS 993 ra 127.0.0.1:18994
# (loopback) để script verify đọc lại. Không dùng container_name để không trùng stack live.
services:
  restore-mail:
    image: ${MAIL07_STALWART_IMAGE:?chạy qua restore-mail07.mjs}
    restart: "no"
    command: ["--config", "/etc/stalwart/config.json"]
    environment:
      STALWART_RECOVERY_ADMIN: ${STALWART_RECOVERY_ADMIN:?chạy qua run-with-secrets.mjs}
    volumes:
      - restore_etc:/etc/stalwart
      - restore_data:/var/lib/stalwart
    networks:
      restore_internal:
        aliases: [mail]

  restore-relay:
    image: redis@sha256:08ad0b1d280850169a790dba1393ff7a90aef951fc19632cf4d3ce4f78e679ba
    restart: "no"
    command: ["nc", "-lk", "-p", "18994", "-e", "nc", "mail", "993"]
    depends_on: [restore-mail]
    ports: ["127.0.0.1:18994:18994"]
    networks: [restore_internal, restore_host_edge]
    read_only: true
    cap_drop: [ALL]

networks:
  restore_internal: {internal: true}
  restore_host_edge: {}
volumes:
  restore_etc: {name: vcworkspace_mail07_restore_etc}
  restore_data: {name: vcworkspace_mail07_restore_data}

name: vcworkspace-cal16-restore
# Chat16 independent restore target: own volumes, own internal network, loopback
# ports 18163 (Nextcloud) and 18164 (Stalwart HTTP/JMAP) only. Restores the
# Nextcloud DB + volume and the chat16 Stalwart volume from backup/. Aliases make
# the restored config.php resolve nc-db/redis/mail16 to the restored services.
# Authentik is not restored (persona app passwords live in the restored DB);
# OIDC login on the restore is NOT_TESTED. The SMB mounts of chat15 point to a
# NAS that is not part of this restore (mount errors are expected and harmless).
services:
  restore-nc-db:
    image: postgres@sha256:aa6eb304ddb6dd26df23d05db4e5cb05af8951cda3e0dc57731b771e0ef4ab29
    restart: "no"
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD_FILE: /run/secrets/restore_db_password
    secrets: [restore_db_password]
    volumes: [restore_nc_db:/var/lib/postgresql]
    networks:
      restore_internal:
        aliases: [nc-db]

  restore-redis:
    image: redis@sha256:08ad0b1d280850169a790dba1393ff7a90aef951fc19632cf4d3ce4f78e679ba
    restart: "no"
    networks:
      restore_internal:
        aliases: [redis]

  restore-mail16:
    image: stalwartlabs/stalwart@sha256:c429b311c93db5606598abc1c68225a85a6953183848ae01bee9c6a98885836c
    platform: linux/arm64
    restart: "no"
    command: ["--config", "/etc/stalwart/config.json"]
    environment:
      STALWART_RECOVERY_ADMIN: ${STALWART_RECOVERY_ADMIN:?run through restore-cal16.mjs}
    volumes:
      - ./stalwart/config.json:/etc/stalwart/config.json:ro
      - restore_mail:/var/lib/stalwart
    networks:
      restore_internal:
        aliases: [mail16]
    mem_limit: 768m

  restore-nextcloud:
    image: vcworkspace-sync15/nextcloud-smb:33.0.10-1
    platform: linux/arm64
    restart: "no"
    depends_on: [restore-nc-db, restore-redis, restore-mail16]
    volumes: [restore_nextcloud:/var/www/html]
    networks: [restore_internal]
    mem_limit: 2g

  restore-relay:
    image: redis@sha256:08ad0b1d280850169a790dba1393ff7a90aef951fc19632cf4d3ce4f78e679ba
    restart: "no"
    command: ["nc", "-lk", "-p", "18163", "-e", "nc", "restore-nextcloud", "80"]
    depends_on: [restore-nextcloud]
    ports: ["127.0.0.1:18163:18163"]
    networks: [restore_internal, restore_host_edge]
    read_only: true
    cap_drop: [ALL]

  restore-mail-relay:
    image: redis@sha256:08ad0b1d280850169a790dba1393ff7a90aef951fc19632cf4d3ce4f78e679ba
    restart: "no"
    command: ["nc", "-lk", "-p", "18164", "-e", "nc", "mail16", "8080"]
    depends_on: [restore-mail16]
    ports: ["127.0.0.1:18164:18164"]
    networks: [restore_internal, restore_host_edge]
    read_only: true
    cap_drop: [ALL]

networks:
  restore_internal: {internal: true}
  restore_host_edge: {}
volumes:
  restore_nc_db: {name: vcworkspace_cal16_restore_nc_db}
  restore_nextcloud: {name: vcworkspace_cal16_restore_nextcloud}
  restore_mail: {name: vcworkspace_cal16_restore_mail}
secrets:
  restore_db_password:
    file: ./secrets/restore_db_password

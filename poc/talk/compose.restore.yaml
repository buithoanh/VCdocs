name: vcworkspace-talk17-restore
# Chat17 independent restore target: own volumes, own internal network,
# loopback port 18173 (Nextcloud) only. Restores the work13 Nextcloud DB +
# volume from backup/. Aliases make the restored config.php resolve nc-db/redis
# to the restored services. No Stalwart (SMTP to mail16 fails harmlessly), no
# Authentik (persona app passwords live in the restored DB), no NAS (chat15
# SMB mounts error out, expected).
services:
  restore-nc-db:
    image: postgres@sha256:aa6eb304ddb6dd26df23d05db4e5cb05af8951cda3e0dc57731b771e0ef4ab29
    restart: "no"
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD_FILE: /run/secrets/restore_db_password
    secrets: [restore_db_password]
    volumes: [restore_nc_db:/var/lib/postgresql]
    networks:
      restore_internal:
        aliases: [nc-db]

  restore-redis:
    image: redis@sha256:08ad0b1d280850169a790dba1393ff7a90aef951fc19632cf4d3ce4f78e679ba
    restart: "no"
    networks:
      restore_internal:
        aliases: [redis]

  restore-nextcloud:
    image: vcworkspace-sync15/nextcloud-smb:33.0.10-1
    platform: linux/arm64
    restart: "no"
    depends_on: [restore-nc-db, restore-redis]
    volumes: [restore_nextcloud:/var/www/html]
    networks: [restore_internal]
    mem_limit: 2g

  restore-relay:
    image: redis@sha256:08ad0b1d280850169a790dba1393ff7a90aef951fc19632cf4d3ce4f78e679ba
    restart: "no"
    command: ["nc", "-lk", "-p", "18173", "-e", "nc", "restore-nextcloud", "80"]
    depends_on: [restore-nextcloud]
    ports: ["127.0.0.1:18173:18173"]
    networks: [restore_internal, restore_host_edge]
    read_only: true
    cap_drop: [ALL]

networks:
  restore_internal: {internal: true}
  restore_host_edge: {}
volumes:
  restore_nc_db: {name: vcworkspace_talk17_restore_nc_db}
  restore_nextcloud: {name: vcworkspace_talk17_restore_nextcloud}
secrets:
  restore_db_password:
    file: ./secrets/restore_db_password

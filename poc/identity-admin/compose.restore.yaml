name: vcworkspace-identity12-restore
services:
  restore-nc-db:
    image: postgres@sha256:aa6eb304ddb6dd26df23d05db4e5cb05af8951cda3e0dc57731b771e0ef4ab29
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD_FILE: /run/secrets/nc_db_password
    secrets: [nc_db_password]
    volumes: [restore_nc_db:/var/lib/postgresql]
    networks:
      restore_internal:
        aliases: [nc-db]

  restore-nextcloud:
    image: nextcloud@sha256:431d389fd8e28b2421149cc877df6c54105f1baaee8c77a3c66ff6cf87d7df33
    platform: linux/arm64
    depends_on: [restore-nc-db]
    environment:
      POSTGRES_HOST: nc-db
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD_FILE: /run/secrets/nc_db_password
    secrets: [nc_db_password]
    volumes: [restore_nextcloud:/var/www/html]
    networks: [restore_internal, restore_loopback]
    mem_limit: 2g

  restore-ak-db:
    image: postgres@sha256:aa6eb304ddb6dd26df23d05db4e5cb05af8951cda3e0dc57731b771e0ef4ab29
    environment:
      POSTGRES_DB: authentik
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD_FILE: /run/secrets/ak_db_password
    secrets: [ak_db_password]
    volumes: [restore_ak_db:/var/lib/postgresql]
    networks: [restore_internal]

  restore-redis:
    image: redis@sha256:08ad0b1d280850169a790dba1393ff7a90aef951fc19632cf4d3ce4f78e679ba
    networks: [restore_internal]

  restore-authentik:
    image: ghcr.io/goauthentik/server@sha256:c0ce79a3fc4533045bfd203254d0c2f71a871d8607a3412f181da247b542e3a1
    platform: linux/arm64
    command: server
    depends_on: [restore-ak-db, restore-redis]
    environment:
      AUTHENTIK_POSTGRESQL__HOST: restore-ak-db
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: file:///run/secrets/ak_db_password
      AUTHENTIK_REDIS__HOST: restore-redis
      AUTHENTIK_SECRET_KEY: file:///run/secrets/ak_secret_key
      AUTHENTIK_LISTEN__HTTP: 0.0.0.0:18124
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_DISABLE_UPDATE_CHECK: "true"
    secrets: [ak_db_password, ak_secret_key]
    networks: [restore_internal, restore_loopback]
    mem_limit: 2g

  restore-nextcloud-loopback-relay:
    image: redis@sha256:08ad0b1d280850169a790dba1393ff7a90aef951fc19632cf4d3ce4f78e679ba
    command: ["nc", "-lk", "-p", "18123", "-e", "nc", "restore-nextcloud", "80"]
    depends_on: [restore-nextcloud]
    ports: ["127.0.0.1:18123:18123"]
    networks: [restore_internal, restore_host_edge]
    read_only: true
    cap_drop: [ALL]

  restore-authentik-loopback-relay:
    image: redis@sha256:08ad0b1d280850169a790dba1393ff7a90aef951fc19632cf4d3ce4f78e679ba
    command: ["nc", "-lk", "-p", "18124", "-e", "nc", "restore-authentik", "18124"]
    depends_on: [restore-authentik]
    ports: ["127.0.0.1:18124:18124"]
    networks: [restore_internal, restore_host_edge]
    read_only: true
    cap_drop: [ALL]

networks:
  restore_internal: {internal: true}
  restore_loopback: {internal: true}
  restore_host_edge: {}
volumes:
  restore_nc_db: {name: vcworkspace_identity12_restore_nc_db_pg18}
  restore_nextcloud: {name: vcworkspace_identity12_restore_nextcloud}
  restore_ak_db: {name: vcworkspace_identity12_restore_ak_db_pg18}
secrets:
  nc_db_password: {file: ./secrets/nc_db_password}
  ak_db_password: {file: ./secrets/ak_db_password}
  ak_secret_key: {file: ./secrets/ak_secret_key}

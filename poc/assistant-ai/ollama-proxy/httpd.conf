# Chat19: path-allow-list proxy from the internal work13 network to the host
# Ollama. Only the two OpenAI-compatible endpoints integration_openai needs are
# forwarded (GET /v1/models, POST /v1/chat/completions); everything else
# (/api/pull, /api/delete, /api/create, /api/generate, …) is 403 here, so a
# compromised Nextcloud cannot make Ollama download or delete models.
# Host header is rewritten to host.docker.internal:11434, which passes Ollama's
# own Host check (it only accepts localhost/*.internal/… when bound to 127.0.0.1).
# Access log = method, path, status, bytes, duration (no bodies, no prompts).
ServerRoot "/etc/apache2"
LoadModule mpm_event_module /usr/lib/apache2/modules/mod_mpm_event.so
LoadModule authz_core_module /usr/lib/apache2/modules/mod_authz_core.so
LoadModule proxy_module /usr/lib/apache2/modules/mod_proxy.so
LoadModule proxy_http_module /usr/lib/apache2/modules/mod_proxy_http.so
ServerName ollama19.internal
Listen 11434
PidFile /tmp/httpd.pid
ErrorLog /proc/self/fd/2
LogFormat "%{%Y-%m-%dT%H:%M:%S}t %a \"%m %U\" %>s %B %Dus" ai19
CustomLog /proc/self/fd/1 ai19
Timeout 900
ProxyTimeout 900
ProxyRequests Off
ProxyPreserveHost Off

<Location "/">
    Require all denied
</Location>
<LocationMatch "^/v1/models$">
    <RequireAll>
        Require method GET
    </RequireAll>
</LocationMatch>
<LocationMatch "^/v1/chat/completions$">
    <RequireAll>
        Require method POST
    </RequireAll>
</LocationMatch>
ProxyPassMatch "^/(v1/(models|chat/completions))$" "http://host.docker.internal:11434/$1"

name: vcworkspace-ai19
# Chat19: single-purpose proxy from the internal work13 network to the host
# Ollama (127.0.0.1:11434 on the Mac, reached by Docker Desktop through
# host.docker.internal). Nextcloud stays on the internal network only (no
# Internet route). The proxy forwards ONLY GET /v1/models and
# POST /v1/chat/completions (ollama-proxy/httpd.conf); /api/pull, /api/delete,
# /api/create… are 403. No published port. Image = the local work13 Nextcloud
# image (Apache + mod_proxy already on disk; nothing downloaded), run as
# www-data with a read-only root filesystem.
# Network alias ends in ".internal": Ollama bound to 127.0.0.1 rejects any
# other Host header with 403 (its DNS-rebinding guard); the proxy rewrites Host.
services:
  ollama-proxy:
    image: vcworkspace-sync15/nextcloud-smb:33.0.10-1
    restart: "no"
    user: "33:33"
    entrypoint: ["apache2", "-DFOREGROUND", "-f", "/etc/ai19/httpd.conf"]
    volumes:
      - ./ollama-proxy/httpd.conf:/etc/ai19/httpd.conf:ro
    tmpfs: [/tmp]
    extra_hosts: ["host.docker.internal:host-gateway"]
    networks:
      work13:
        aliases: [ollama19, ollama19.internal]
      ai19_egress: {}
    read_only: true
    cap_drop: [ALL]
    mem_limit: 128m

networks:
  work13:
    external: true
    name: vcworkspace-work13_work13
  ai19_egress: {}
